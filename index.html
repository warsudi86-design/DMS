/* ================= KARTU STOK (dilebur ke Inventory Master, per permintaan user) =================
   Sebelumnya ini menu sidebar sendiri ("Kartu Stok") terpisah dari Inventory Master, dengan dropdown
   pilih part sendiri - membingungkan karena datanya sebenarnya cuma "drill-down" dari 1 baris part yang
   sama di Inventory Master. Sekarang dilebur: klik No. Part (atau tombol "Kartu Stok") di baris Inventory
   Master langsung buka drawer ini - riwayat mutasi tetap dihitung LIVE dari Stock_Ledger (getKartuStok()
   di backend, bukan input manual), plus tombol Print PDF yang sebelumnya tidak ada sama sekali. */
window.__lastKartuStokData = null;
async function viewKartuStok(partNumber){
  openDrawer(`
    <div class="drawer-head"><h3>Kartu Stok</h3><button class="drawer-close" onclick="closeDrawer()">&times;</button></div>
    <div class="drawer-body" id="ks_drawer_body">${skeletonRows(3)}</div>
    <div class="drawer-foot">
      <button class="btn secondary" onclick="closeDrawer()">Tutup</button>
      <button class="btn" onclick="printKartuStok()">${icon('print')||'🖨'} Print PDF</button>
    </div>
  `, true);
  const res = await apiGet('getKartuStok', {partNumber});
  const body = document.getElementById('ks_drawer_body');
  if(!body) return; // drawer sudah ditutup sebelum request selesai
  if(!res.success){ body.innerHTML = emptyState(res.message); window.__lastKartuStokData = null; return; }
  const {part, history} = res.data;
  window.__lastKartuStokData = {part, history};
  const trendVals = history.slice(-12).map(h=>Number(h.StokSesudah));
  const trendLabels = history.slice(-12).map(h=>fmtDate(h.Tgl));
  body.innerHTML = `
    <p class="sub" style="margin:0 0 12px;"><b>${esc(part.PartNumber)}</b> - ${esc(part.PartName)}</p>
    <div class="cards">
      <div class="stat-card"><div class="label">Stok Akhir</div><div class="value">${part.StokAkhir}</div></div>
      <div class="stat-card"><div class="label">Stok Minimum</div><div class="value">${part.StokMinimum}</div></div>
      <div class="stat-card"><div class="label">Lokasi</div><div class="value" style="font-size:16px;">${esc(part.Lokasi)||'-'}</div></div>
    </div>
    ${trendVals.length>1 ? `<h3 style="font-size:13px;margin:14px 0 8px;">Tren Stok (mutasi terakhir)</h3><div id="ks_line"></div>` : ''}
    <h3 style="font-size:13px;margin:14px 0 8px;">Riwayat Mutasi</h3>
    ${history.length===0 ? emptyState('Belum ada mutasi.') : `<table><tr><th>Tgl</th><th>Tipe</th><th>Qty</th><th>Sumber</th><th>Reference</th><th>Stok Sebelum</th><th>Stok Sesudah</th></tr>
    ${history.slice().reverse().map(h=>`<tr><td>${fmtDate(h.Tgl)}</td><td><span class="badge ${h.Tipe==='Inbound'?'good':'critical'}"><span class="dot"></span>${h.Tipe}</span></td><td class="num">${h.Qty}</td><td>${esc(h.Sumber)}</td><td>${esc(h.Reference)}</td><td class="num">${h.StokSebelum}</td><td class="num">${h.StokSesudah}</td></tr>`).join('')}
    </table>`}
  `;
  if(trendVals.length>1){
    const lc = lineChart(trendLabels, trendVals);
    const ksLine = document.getElementById('ks_line');
    ksLine.innerHTML = lc.svg;
    attachLineChart(ksLine, lc);
    attachLineTooltip(ksLine, lc.pts);
  }
}
function printKartuStok(){
  const data = window.__lastKartuStokData;
  if(!data){ toast('Data Kartu Stok belum siap, tunggu sebentar lalu coba lagi.', true); return; }
  const {part, history} = data;
  const body = `
    <div class="print-grid">
      <div><span>No. Part</span><b>${esc(part.PartNumber)}</b></div>
      <div><span>Nama Part</span><b>${esc(part.PartName)}</b></div>
      <div><span>Stok Akhir</span><b>${part.StokAkhir}</b></div>
      <div><span>Stok Minimum</span><b>${part.StokMinimum}</b></div>
      <div><span>Lokasi</span><b>${esc(part.Lokasi)||'-'}</b></div>
      <div><span>Dicetak Pada</span><b>${fmtDate(new Date())}</b></div>
    </div>
    <table class="doc-table"><colgroup><col style="width:14%"><col style="width:12%"><col style="width:8%"><col style="width:20%"><col style="width:20%"><col style="width:13%"><col style="width:13%"></colgroup>
      <tr><th>Tgl</th><th>Tipe</th><th class="num">Qty</th><th>Sumber</th><th>Reference</th><th class="num">Stok Sebelum</th><th class="num">Stok Sesudah</th></tr>
      ${history.length===0 ? `<tr><td colspan="7" style="text-align:center;color:#777;">Belum ada mutasi.</td></tr>` :
      history.map(h=>`<tr><td>${fmtDate(h.Tgl)}</td><td>${esc(h.Tipe)}</td><td class="num">${h.Qty}</td><td>${esc(h.Sumber)}</td><td>${esc(h.Reference)}</td><td class="num">${h.StokSebelum}</td><td class="num">${h.StokSesudah}</td></tr>`).join('')}
    </table>
    <p style="font-size:11.5px;color:#555;margin-top:14px;">Kartu stok ini dihitung otomatis dari seluruh mutasi (Inbound/Outbound) tercatat di sistem - bukan input manual.</p>
  `;
  openPrintWindow(buildPrintDocument('KARTU STOK', part.PartNumber, body, getPrintCss()));
}

let woCart = { parts:[], labors:[], sublets:[] };
let woFormMode = 'wo'; // 'wo' = Buat Work Order, 'estimasi' = Buat Estimasi (lihat formEstimasi()) - dipakai addWOPart utk skip cek stok saat mode estimasi.
let woViewMode = 'kanban';
const WO_FLOW = ['New','Dispatching','Material Picking','Completed','Invoice','Vehicle Delivery'];
// Field tanggal per status (cermin WO_STATUS_DATE_FIELD di Code.gs) - dipakai utk hitung trend hari ini vs kemarin di scorecard Board.
const WO_STATUS_DATE_FIELD_JS = {
  'New':'TglNew','Dispatching':'TglDispatching','Material Picking':'TglMaterialPicking',
  'Completed':'TglCompleted','Invoice':'TglInvoice','Vehicle Delivery':'TglVehicleDelivery'
};
function isSameLocalDay(d1, d2){ return d1.getFullYear()===d2.getFullYear() && d1.getMonth()===d2.getMonth() && d1.getDate()===d2.getDate(); }

async function renderWorkOrder(){
  setMain(skeletonRows(4));

  const data = window.__woData || [];
  setMain(`

    ${filterBarHtml('wo', [

      {key:'Mekanik', label:'Mekanik', options:[...new Set(data.map(w=>w.Mekanik).filter(Boolean))]},
      {key:'Status', label:'Status', options:WO_FLOW}
    ], 'TglWO', {apply:'applyWOFilter()', reset:'resetWOFilter()'}, {keys:['WOID','NamaCustomer','NoPolisi'], placeholder:'Cari No. WO / Customer / No Polisi...'})}
    <div id="woBody"></div>
  `);
  window['__rawdata_wo'] = data;
  if(woViewMode==='kanban') drawKanban(data); else drawWOList(data);

function applyWOFilter(){
  applyFilterBar('wo', filtered=>{ if(woViewMode==='kanban') drawKanban(filtered); else drawWOList(filtered); });
}
function resetWOFilter(){
  resetFilterBar('wo', filtered=>{ if(woViewMode==='kanban') drawKanban(filtered); else drawWOList(filtered); });
}
function drawKanban(data){
  // Ringkasan scorecard per status (bukan daftar kartu per-WO) supaya space tetap ringkas walau
  // jumlah WO terus bertambah. Tiap tile: total WO, total nilai, dan trend naik/turun (hari ini vs kemarin)
  // dihitung dari field tanggal masuk status tsb (TglNew/TglDispatching/dst).
  const el = document.getElementById('woBody');
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const yesterday = new Date(today); yesterday.setDate(yesterday.getDate()-1);
  el.innerHTML = `<div class="kanban-score">${WO_FLOW.map(status=>{
    const items = data.filter(w=>w.Status===status);
    const count = items.length;
    const totalValue = items.reduce((s,w)=>s+(Number(w.TotalWO)||0),0);
    const dateField = WO_STATUS_DATE_FIELD_JS[status];
    let todayCount=0, yestCount=0;
    items.forEach(w=>{
      const dv = w[dateField];
      if(!dv) return;
      const d = new Date(dv);
      if(isNaN(d.getTime())) return;
      const dd = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      if(isSameLocalDay(dd, today)) todayCount++;
      else if(isSameLocalDay(dd, yesterday)) yestCount++;
    });
    let trendCls='flat', trendIcon='▬', trendLabel='Stabil';
    if(todayCount > yestCount){ trendCls='up'; trendIcon='▲'; trendLabel='Naik'; }
    else if(todayCount < yestCount){ trendCls='down'; trendIcon='▼'; trendLabel='Turun'; }
    const diff = Math.abs(todayCount - yestCount);
    return `<div class="score-tile" onclick="jumpToWOStatus('${status}')" title="Klik untuk lihat daftar WO status ${esc(status)}">
      <div class="score-head"><span class="badge ${WO_STATUS_SLOT[status]}"><span class="dot"></span></span>${esc(status)}</div>
      <div class="score-num">${count}</div>
      <div class="score-total">${fmtMoney(totalValue)}</div>
      <span class="score-trend ${trendCls}">${trendIcon} ${trendLabel}${diff>0?' '+diff:''}</span>
      <div class="score-sub">Masuk hari ini: <b>${todayCount}</b> · kemarin: <b>${yestCount}</b></div>
    </div>`;
  }).join('')}</div>`;
}
function jumpToWOStatus(status){
  woViewMode = 'list';
  drawWorkOrderView();
  setFieldValue('flt_wo_Status', status);
  applyWOFilter();
}

// Cache ringan di sisi browser untuk data master yang jarang berubah (Customer/Vehicle/Part/Labor/Sublet).
// Setiap request ke Apps Script Web App kena overhead "cold start" eksekusi (bukan cuma soal ukuran data),
// jadi kalau form Buat WO dibuka berkali-kali dalam sesi yang sama, tidak perlu fetch ulang selama masih
// dalam masa berlaku cache (60 detik) - kecuali baru saja disimpan datanya (lihat invalidateWOFormCache()).
const WO_FORM_CACHE_TTL_MS = 60000;
async function getWOFormMasterData(){
  const c = window.__woFormCache;
  if(c && (Date.now()-c.ts) < WO_FORM_CACHE_TTL_MS) return c;
  const res = await apiGet('getWOFormBootstrap');
  const d = res.data||{};
  const cache = { ts: Date.now(), customers:d.customers||[], vehicles:d.vehicles||[], parts:d.parts||[], labors:d.labors||[], sublets:d.sublets||[] };
  window.__woFormCache = cache;
  return cache;
}
function invalidateWOFormCache(){ window.__woFormCache = null; }

  const actor = getActor();

// Muat data dari Estimasi yang sudah pernah dibuat (menu "Estimasi") ke form Buat Work Order ini, supaya
// SA tidak perlu ketik ulang Customer/Kendaraan/Part/Jasa/Sublet dari nol kalau customer jadi service.
// Harga part/jasa SENGAJA diambil ulang dari harga TERKINI (bukan harga saat Estimasi dibuat) karena harga
// atau stok bisa saja sudah berubah sejak estimasi dibuat.
async function loadEstimasiIntoForm(){
  const idVal = (val('wo_est_search')||'').trim();
  if(!idVal){ toast('Ketik nomor Estimasi terlebih dahulu', true); return; }
  const res = await apiGet('getEstimasi', {id:idVal});
  if(!res.success){ toast(res.message||'Estimasi tidak ditemukan', true); return; }
  const {header:est, parts, labors, sublets} = res.data;
  if(est.Status !== 'Aktif'){ toast('Estimasi ini sudah berstatus "'+est.Status+'", tidak bisa dimuat lagi.', true); return; }
  const veh = window.__vehicles.find(v=>String(v.VehicleID)===String(est.VehicleID));
  if(!veh){ toast('Kendaraan pada Estimasi ini sudah tidak ditemukan di Master Vehicle.', true); return; }
  const cust = window.__customers.find(c=>String(c.CustomerID)===String(est.CustomerID));
  document.getElementById('wo_cust_id').value = est.CustomerID;
  setFieldValue('wo_veh_combo', veh.VehicleID);
  const vehInput = document.getElementById('wo_veh_combo_input');
  if(vehInput) vehInput.value = veh.NoPolisi + ' — ' + (cust?cust.Nama:'(tanpa nama)');
  const sec = document.getElementById('wo_items_section'); if(sec) sec.classList.remove('locked');
  const hint = document.getElementById('wo_lock_hint'); if(hint) hint.style.display = 'none';
  setFieldValue('wo_jenis', est.JenisWO||'General Repair');
  setFieldValue('wo_km', est.KM||'');
  setFieldValue('wo_keluhan', est.Keluhan||'');

  woCart = { parts:[], labors:[], sublets:[] };
  let hilang = [];
  (parts||[]).forEach(p=>{
    const cur = window.__parts.find(x=>String(x.PartNumber)===String(p.PartNumber));
    if(cur) woCart.parts.push({PartNumber:cur.PartNumber, PartName:cur.PartName, Qty:Number(p.Qty)||1, Harga:cur.HargaJual, DiskonPersen:0});
    else hilang.push(p.PartName+' (part sudah tidak ada di Part Master)');
  });
  (labors||[]).forEach(l=>{
    const cur = window.__labors.find(x=>String(x.LaborCode)===String(l.LaborCode));
    if(cur) woCart.labors.push({LaborCode:cur.LaborCode, LaborName:cur.LaborName, Qty:Number(l.Qty)||1, Harga:cur.Harga, DiskonPersen:0});
    else hilang.push(l.LaborName+' (jasa sudah tidak ada di Labor Master)');
  });
  (sublets||[]).forEach(s=>{
    woCart.sublets.push({SubletName:s.SubletName, Qty:Number(s.Qty)||1, HargaBeli:Number(s.HargaBeli)||0, HargaJual:Number(s.HargaJual)||0, DiskonPersen:0});
  });
  renderWOLists();
  window.__activeEstimasiID = est.EstimasiID;
  const info = document.getElementById('wo_est_loaded_info');
  if(info) info.innerHTML = `<p class="sub" style="margin:6px 0 0;color:var(--good,#0a8f0a);">✓ Estimasi <b>${esc(est.EstimasiID)}</b> dimuat. Harga part/jasa sudah disesuaikan ke harga terkini - cek ulang sebelum simpan. <a href="#" onclick="event.preventDefault();clearLoadedEstimasi();">Batal pakai estimasi ini</a></p>`;
  toast('Estimasi '+est.EstimasiID+' dimuat ke form.'+(hilang.length?(' Catatan: '+hilang.join(', ')+' tidak ikut dimuat.'):''));
}
function clearLoadedEstimasi(){
  window.__activeEstimasiID = null;
  const info = document.getElementById('wo_est_loaded_info'); if(info) info.innerHTML='';
  setFieldValue('wo_est_search','');
}
async function addWOPart(){
  const pn = val('wo_part_combo');
  if(!pn){ toast('Pilih part terlebih dahulu dari hasil pencarian', true); return; }
  const qty = Number(val('wo_part_qty'))||1;
  const disc = Math.min(1, Math.max(0, Number(val('wo_part_disc'))||0));
  // Ambil ulang data part TERBARU langsung dari server sebelum cek stok, supaya tidak memakai data
  // cache lama di browser (mis. drawer WO sudah lama terbuka sementara stok baru saja berubah di menu lain).
  const pres = await apiGet('listPart');
  if(pres.success) window.__parts = pres.data||window.__parts;
  const part = window.__parts.find(p=>String(p.PartNumber)===String(pn));
  if(!part){ toast('Part tidak ditemukan, silakan cari ulang', true); return; }
  const stokTersedia = Number(part.StokAkhir)||0;
  // Mode Estimasi: part dgn stok kosong/kurang tetap boleh diestimasikan (belum ada komitmen barang keluar,
  // sering justru itu tujuan customer minta estimasi - cek dulu apa perlu pesan part sebelum service beneran).
  if(woFormMode!=='estimasi'){
    if(stokTersedia<=0){ toast('Stok part "'+part.PartName+'" saat ini kosong (0), tidak bisa ditambahkan', true); return; }
    if(qty > stokTersedia){ toast('Qty ('+qty+') melebihi stok tersedia ('+stokTersedia+') untuk part "'+part.PartName+'"', true); return; }
  }
  if(woCart.parts.some(p=>String(p.PartNumber)===String(part.PartNumber))){
    toast('Part "'+part.PartName+'" sudah ada di daftar item WO ini. Hapus dulu baris yang sudah ada kalau mau ubah qty/diskon.', true); return;
  }
  woCart.parts.push({PartNumber:part.PartNumber, PartName:part.PartName, Qty:qty, Harga:part.HargaJual, DiskonPersen:disc});
  renderWOLists();
  setFieldValue('wo_part_combo',''); const inp=document.getElementById('wo_part_combo_input'); if(inp) inp.value='';
  setFieldValue('wo_part_disc',0);
}
function removeWOPart(i){ woCart.parts.splice(i,1); renderWOLists(); }

function addWOSublet(){

// Tabel ringkas untuk daftar item WO (Part/Labor/Sublet) yang sudah ditambahkan ke keranjang -
// lebih rapi & mudah dibandingkan dibanding bentuk chip/pill sebelumnya.
function woItemsTableHtml(items, nameKey, priceKey, removeFnName, emptyLabel){
  if(!items.length) return `<span class="muted" style="font-size:12px;">${emptyLabel}</span>`;
  return `<div style="border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px;">
    <table style="margin:0;"><thead><tr><th>Nama</th><th>Qty</th><th>Harga Satuan</th><th>Diskon</th><th>Subtotal</th><th></th></tr></thead><tbody>
    ${items.map((it,i)=>{
      const harga = it[priceKey]||0;
      const disc = it.DiskonPersen||0;
      const gross = harga*it.Qty;
      const net = gross*(1-disc);
      const discText = disc>0 ? (disc*100).toFixed(disc*100%1===0?0:1)+'%' : '-';
      return `<tr>
        <td>${esc(it[nameKey])}</td>
        <td class="num">${it.Qty}</td>
        <td class="num">${fmtMoneyFull(harga)}</td>
        <td class="num">${discText}</td>
        <td class="num"><b>${fmtMoneyFull(net)}</b></td>
        <td><button class="btn ghost sm" onclick="${removeFnName}(${i})" title="Hapus">&times;</button></td>
      </tr>`;
    }).join('')}
    </tbody></table>
  </div>`;
}
function renderWOLists(){
  // Beberapa elemen (mis. Labor/Sublet) sengaja tidak ada sama sekali di form Part Direct Sales (cuma jual
  // part, tanpa jasa/sublet) - makanya semua lookup di sini pakai null-check, bukan diasumsikan selalu ada.
  const partListEl = document.getElementById('wo_part_list');
  if(partListEl) partListEl.innerHTML = woItemsTableHtml(woCart.parts, 'PartName', 'Harga', 'removeWOPart', 'Belum ada part.');
  const laborListEl = document.getElementById('wo_labor_list');
  if(laborListEl) laborListEl.innerHTML = woItemsTableHtml(woCart.labors, 'LaborName', 'Harga', 'removeWOLabor', 'Belum ada jasa.');
  const subletListEl = document.getElementById('wo_sublet_list');
  if(subletListEl) subletListEl.innerHTML = woItemsTableHtml(woCart.sublets, 'SubletName', 'HargaJual', 'removeWOSublet', 'Belum ada sublet.');

  const grossOf = arr => arr.reduce((s,x)=>s+(x.Harga!==undefined?x.Harga:x.HargaJual)*x.Qty,0);
  const discOf = arr => arr.reduce((s,x)=>s+((x.Harga!==undefined?x.Harga:x.HargaJual)*x.Qty)*(x.DiskonPersen||0),0);
  const subtotal = grossOf(woCart.parts) + grossOf(woCart.labors) + grossOf(woCart.sublets);
  const totalDiskon = discOf(woCart.parts) + discOf(woCart.labors) + discOf(woCart.sublets);
  const total = Math.max(0, subtotal - totalDiskon);
  const ratio = subtotal>0 ? (totalDiskon/subtotal) : 0;

  const subtotalEl = document.getElementById('wo_subtotal_preview'); if(subtotalEl) subtotalEl.textContent = fmtMoneyFull(subtotal);
  const diskonPreviewEl = document.getElementById('wo_diskon_preview'); if(diskonPreviewEl) diskonPreviewEl.textContent = fmtMoneyFull(totalDiskon);
  const totalEl = document.getElementById('wo_total_preview'); if(totalEl) totalEl.textContent = fmtMoneyFull(total);
  // PPN 11% di sini murni PREVIEW untuk memperjelas estimasi nilai yang harus dibayar customer saat
  // pembuatan WO - basisnya total setelah diskon. Belum final; penetapan PPN yang resmi tetap dilakukan
  // Kasir saat cetak Invoice (bisa dicentang lagi di sana), jadi tidak mempengaruhi TotalWO yang tersimpan.
  const ppnToggleEl = document.getElementById('wo_ppn_toggle');
  const ppnOn = !!(ppnToggleEl && ppnToggleEl.checked);
  const ppnAmount = ppnOn ? Math.round(total*0.11) : 0;
  const grandTotal = total + ppnAmount;
  const ppnRowEl = document.getElementById('wo_ppn_row'); if(ppnRowEl) ppnRowEl.style.display = ppnOn?'flex':'none';
  const ppnPreviewEl = document.getElementById('wo_ppn_preview'); if(ppnPreviewEl) ppnPreviewEl.textContent = fmtMoneyFull(ppnAmount);
  const gtRowEl = document.getElementById('wo_grandtotal_row'); if(gtRowEl) gtRowEl.style.display = ppnOn?'flex':'none';
  const gtEl = document.getElementById('wo_grandtotal_preview'); if(gtEl) gtEl.textContent = fmtMoneyFull(grandTotal);
  const ratioTextEl = document.getElementById('wo_diskon_ratio_text'); if(ratioTextEl) ratioTextEl.textContent = (ratio*100).toFixed(1)+'%';
  const ratioBarEl = document.getElementById('wo_diskon_ratio_bar');
  if(ratioBarEl){
    ratioBarEl.classList.toggle('over', ratio>0.1);
    const barInner = ratioBarEl.querySelector('div'); if(barInner) barInner.style.width = Math.min(100, ratio*100)+'%';
  }
  const actor = getActor();
  const overLimit = ratio > 0.1;
  const warnEl = document.getElementById('wo_diskon_warning');
  if(warnEl) warnEl.innerHTML = overLimit
    ? `<div class="warn-box" style="margin-top:8px;">Diskon melebihi 10% dari subtotal. WO tetap bisa disimpan, tapi <b>tidak bisa Dispatching</b> sampai disetujui oleh akun Manager.</div>`
    : '';
  // Tombol Simpan TIDAK pernah dinonaktifkan di sini - SA selalu boleh menyimpan WO.
  // Persetujuan Manager baru diperlukan nanti saat WO mau naik ke status Dispatching.
}
async function submitWorkOrder(){
  const custId = val('wo_cust_id'); const vehId = val('wo_veh_combo');
  if(!custId || !vehId){ toast('Pilih Customer / Kendaraan terlebih dahulu lewat kotak pencarian', true); return; }
  const grossOf = arr => arr.reduce((s,x)=>s+(x.Harga!==undefined?x.Harga:x.HargaJual)*x.Qty,0);
  const discOf = arr => arr.reduce((s,x)=>s+((x.Harga!==undefined?x.Harga:x.HargaJual)*x.Qty)*(x.DiskonPersen||0),0);
  const subtotal = grossOf(woCart.parts) + grossOf(woCart.labors) + grossOf(woCart.sublets);
  const totalDiskon = discOf(woCart.parts) + discOf(woCart.labors) + discOf(woCart.sublets);
  const actor = getActor();
  const payload = {
    CustomerID: custId, VehicleID: vehId, JenisWO: val('wo_jenis'),
    SA: val('wo_sa'), KM: val('wo_km'), Keluhan: val('wo_keluhan'), Diskon: totalDiskon,
    ActorRole: actor.role, ActorName: actor.name,
    parts: woCart.parts.map(p=>({PartNumber:p.PartNumber, Qty:p.Qty})),
    labors: woCart.labors.map(l=>({LaborCode:l.LaborCode, Qty:l.Qty})),
    sublets: woCart.sublets.map(s=>({SubletName:s.SubletName, Qty:s.Qty, HargaBeli:s.HargaBeli, HargaJual:s.HargaJual}))
  };
  const res = await apiPost('createWorkOrder', payload);
  if(res.success){
    toast('Work Order dibuat: '+res.id);
    if(window.__activeEstimasiID){
      await apiPost('convertEstimasi', {EstimasiID:window.__activeEstimasiID, WOID:res.id, ActorName:actor.name});
      window.__activeEstimasiID = null;
    }
    invalidateWOFormCache(); closeDrawer(); refreshCurrentView();
  } else toast(res.message,true);
}
async function viewWorkOrder(woid){
  const res = await apiGet('getWorkOrder', {id:woid});
  if(!res.success){ toast(res.message,true); return; }
  const {header, parts, labors, sublets} = res.data;
  const curIdx = WO_FLOW.indexOf(header.Status);
  let nextStatus = header.Status==='Cancelled' ? null : WO_FLOW[curIdx+1];
  const noParts = (parts||[]).length===0;
  if(nextStatus==='Material Picking' && noParts) nextStatus = 'Completed'; // WO tanpa part, lewati tahap Part Staff
  // SA masih bisa tambah Jasa/Part/Sublet SELAMA belum Completed - begitu Completed, item dikunci.
  const editable = ['New','Dispatching','Material Picking'].indexOf(header.Status)!==-1;
  const actor = getActor();
  const subtotalKotor = Number(header.TotalPart||0)+Number(header.TotalLabor||0)+Number(header.TotalSublet||0);
  const diskonRatio = subtotalKotor>0 ? (Number(header.Diskon||0)/subtotalKotor) : 0;
  const diskonPending = diskonRatio > 0.1 && !header.DiskonApprovedBy;
  const stepperHtml = header.Status==='Cancelled'
    ? `<div class="danger-box">⚠ Work Order ini <b>DIBATALKAN</b> oleh ${esc(header.CancelledBy||'-')} pada ${fmtDate(header.TglCancel)}.<br>Alasan: ${esc(header.CancelReason||'-')}</div>`
    : `<div class="stepper">${WO_FLOW.map((s,i)=>`
    <div class="step ${i<curIdx?'done':''} ${i===curIdx?'current':''}">
      <div class="circle">${i<curIdx?'✓':i+1}</div><div class="stitle">${s}</div>
    </div>`).join('')}</div>`;
  openDrawer(`
    <div class="drawer-head"><h3>Work Order ${header.WOID}</h3><button class="drawer-close" onclick="closeDrawer()">&times;</button></div>
    <div class="drawer-body">
      ${stepperHtml}
      <div class="grid3">
        <div class="kv"><span>Customer</span><b>${esc(header.NamaCustomer)}</b></div>
        <div class="kv"><span>No Polisi</span><b>${esc(header.NoPolisi)}</b></div>
        <div class="kv"><span>Jenis WO</span><b>${esc(header.JenisWO)}</b></div>
        <div class="kv"><span>SA</span><b>${esc(header.SA)||'-'}</b></div>
        <div class="kv"><span>Mekanik</span><b>${esc(header.Mekanik)||'-'}</b></div>
        <div class="kv"><span>KM</span><b>${esc(header.KM)||'-'}</b></div>
        ${header.InvoiceNumber ? `<div class="kv"><span>No. Invoice</span><b>${esc(header.InvoiceNumber)}</b></div>` : ''}
      </div>
      <p class="muted" style="font-size:13px;">Keluhan: ${esc(header.Keluhan)||'-'}</p>

      <div class="flex-between"><h3 style="font-size:13.5px;margin:14px 0 8px;">Part</h3>${editable?`<button class="btn ghost sm" onclick="openAddItemModal('${woid}','part')">${icon('plus')} Tambah Part</button>`:''}</div>
      <table><tr><th>Part</th><th>Qty</th><th>Harga</th><th>Subtotal</th><th>Status</th>${editable?'<th></th>':''}</tr>
        ${parts.map(p=>`<tr><td>${esc(p.PartName)}</td><td>${p.Qty}</td><td>${fmtMoneyFull(p.HargaSatuan)}</td><td>${fmtMoneyFull(p.Subtotal)}</td><td><span class="badge ${p.StatusPicking==='Picked'?'good':p.StatusPicking==='Returned'?'critical':'muted'}"><span class="dot"></span>${p.StatusPicking}</span></td>${editable?`<td><button class="btn ghost sm" title="Hapus item ini" onclick="doDeleteWOItem('${woid}','part','${p.RowID}','${esc(p.PartName)}')">&times;</button></td>`:''}</tr>`).join('') || `<tr><td colspan="${editable?6:5}">${emptyState('Tidak ada part')}</td></tr>`}
      </table>

      <div class="flex-between"><h3 style="font-size:13.5px;margin:14px 0 8px;">Labor</h3>${editable?`<button class="btn ghost sm" onclick="openAddItemModal('${woid}','labor')">${icon('plus')} Tambah Jasa</button>`:''}</div>
      <table><tr><th>Jasa</th><th>Qty</th><th>Harga</th><th>Subtotal</th>${editable?'<th></th>':''}</tr>
        ${labors.map(l=>`<tr><td>${esc(l.LaborName)}</td><td>${l.Qty}</td><td>${fmtMoneyFull(l.HargaSatuan)}</td><td>${fmtMoneyFull(l.Subtotal)}</td>${editable?`<td><button class="btn ghost sm" title="Hapus item ini" onclick="doDeleteWOItem('${woid}','labor','${l.RowID}','${esc(l.LaborName)}')">&times;</button></td>`:''}</tr>`).join('') || `<tr><td colspan="${editable?5:4}">${emptyState('Tidak ada labor')}</td></tr>`}
      </table>

      <div class="flex-between"><h3 style="font-size:13.5px;margin:14px 0 8px;">Sublet</h3>${editable?`<button class="btn ghost sm" onclick="openAddItemModal('${woid}','sublet')">${icon('plus')} Tambah Sublet</button>`:''}</div>
      <table><tr><th>Sublet</th><th>Qty</th><th>Harga Jual</th><th>Subtotal</th>${editable?'<th></th>':''}</tr>
        ${(sublets||[]).map(s=>`<tr><td>${esc(s.SubletName)}</td><td>${s.Qty}</td><td>${fmtMoneyFull(s.HargaJual)}</td><td>${fmtMoneyFull(s.Subtotal)}</td>${editable?`<td><button class="btn ghost sm" title="Hapus item ini" onclick="doDeleteWOItem('${woid}','sublet','${s.RowID}','${esc(s.SubletName)}')">&times;</button></td>`:''}</tr>`).join('') || `<tr><td colspan="${editable?5:4}">${emptyState('Tidak ada sublet')}</td></tr>`}
      </table>

      <div class="kv" style="margin-top:8px;"><span>Subtotal (Part+Labor+Sublet)</span><b>${fmtMoneyFull(subtotalKotor)}</b></div>
      ${Number(header.Diskon||0)>0?`<div class="kv"><span>Diskon (${(diskonRatio*100).toFixed(1)}%)</span><b>- ${fmtMoneyFull(header.Diskon)}</b></div>`:''}
      <div class="kv" style="font-size:15px;margin-top:4px;"><span>Total Work Order</span><b>${fmtMoneyFull(header.TotalWO)}</b></div>
      ${diskonPending ? `<div class="danger-box" style="margin-top:10px;">⚠ Diskon ${(diskonRatio*100).toFixed(1)}% melebihi 10% dari subtotal, <b>menunggu persetujuan Manager</b> sebelum WO ini bisa Dispatching.
        ${actor.role==='Manager' ? `<div style="margin-top:8px;"><button class="btn good sm" onclick="confirmApproveDiskon('${woid}')">${icon('approve')} Setujui Diskon Sekarang</button></div>` : ''}
      </div>` : (header.DiskonApprovedBy ? `<div class="warn-box" style="margin-top:10px;">✓ Diskon di atas 10% sudah disetujui oleh <b>${esc(header.DiskonApprovedBy)}</b>.</div>` : '')}
      ${!editable && header.Status!=='Cancelled' ? `<p class="sub" style="margin-top:8px;">ℹ WO sudah Completed, tidak bisa ditambah item lagi.</p>`:''}
      ${noParts && header.Status==='Dispatching' ? `<p class="sub" style="margin-top:8px;">ℹ WO ini tidak ada part, jadi tahap Material Picking (Part Staff) otomatis dilewati — langsung ke Completed.</p>`:''}
    </div>
    <div class="drawer-foot">
      <div style="display:flex;gap:8px;">
        <button class="btn secondary" onclick="closeDrawer()">Tutup</button>
        <button class="btn ghost" onclick="printWorkOrder('${woid}')">🖨 Cetak Form WO</button>
        ${['Invoice','Vehicle Delivery'].indexOf(header.Status)!==-1 ? `<button class="btn ghost" onclick="printInvoice('${woid}')">🖨 Cetak Invoice</button>`:''}
      </div>
      <div style="display:flex;gap:8px;">
        ${header.Status!=='Cancelled' && (actor.role==='Manager'||actor.role==='Super Admin') ? `<button class="btn critical" onclick="openCancelModal('${woid}','${esc(header.Status)}')">Batalkan WO</button>`:''}
        ${nextStatus ? `<button class="btn good" onclick="openAdvanceModal('${woid}','${header.Status}','${nextStatus}')">${icon('approve')} Set: ${nextStatus}</button>` : (header.Status!=='Cancelled' ? '<span class="muted">Selesai</span>':'')}
      </div>
    </div>
  `);
}
async function confirmApproveDiskon(woid){
  const actor = getActor();
  const res = await apiPost('approveWODiskon', {WOID:woid, ActorRole:actor.role, ActorName:actor.name});
  if(res.success){ toast('Diskon disetujui, WO siap Dispatching'); viewWorkOrder(woid); refreshCurrentView(); } else toast(res.message,true);
}

/* ---- tambah item (Part/Labor/Sublet) ke WO yang sudah ada, sebelum masuk status Invoice ---- */
async function openAddItemModal(woid, type){
  if(type==='part' && !(window.__parts&&window.__parts.length)){ const r=await apiGet('listPart'); window.__parts=r.data||[]; }
  if(type==='labor' && !(window.__labors&&window.__labors.length)){ const r=await apiGet('listLabor'); window.__labors=r.data||[]; }
  if(type==='sublet' && !(window.__sublets&&window.__sublets.length)){ const r=await apiGet('listSublet'); window.__sublets=r.data||[]; }
  let bodyHtml='';
  if(type==='part'){
    bodyHtml = `<label>Cari Part</label>${comboSearchHtml('ai_part_combo','Cari No Part / Nama Part...')}
      <label>Qty</label><input id="ai_part_qty" type="number" value="1">`;
  } else if(type==='labor'){
    bodyHtml = `<label>Cari Jasa</label>${comboSearchHtml('ai_labor_combo','Cari Kode / Nama Jasa...')}
      <label>Qty</label><input id="ai_labor_qty" type="number" value="1">`;
  } else {
    bodyHtml = `<label>Cari / Ketik Nama Sublet</label>${comboSearchHtml('ai_sublet_combo','Cari sublet yang sudah ada, atau ketik nama baru...')}
      <div class="grid3">
        <div><label>Qty</label><input id="ai_sublet_qty" type="number" value="1"></div>
        <div><label>Harga Beli</label><input id="ai_sublet_hb" type="number" value="0"></div>
        <div><label>Harga Jual</label><input id="ai_sublet_hj" type="number" value="0"></div>
      </div>`;
  }
  const titleMap = {part:'Tambah Part ke WO', labor:'Tambah Jasa ke WO', sublet:'Tambah Sublet ke WO'};
  openModal(`
    <h3 style="margin:0 0 14px;">${titleMap[type]}</h3>
    ${bodyHtml}
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:6px;">
      <button class="btn secondary" onclick="closeModal()">Batal</button>
      <button class="btn" onclick="submitAddItem('${woid}','${type}')">Tambahkan</button>
    </div>
  `);
  if(type==='part'){
    attachComboSearch('ai_part_combo', window.__parts, {
      getLabel:p=>`${p.PartNumber} - ${p.PartName}`,
      getSub:p=>Number(p.StokAkhir)<=0 ? `⚠ STOK HABIS · ${fmtMoneyFull(p.HargaJual)}` : `Stok: ${p.StokAkhir} · ${fmtMoneyFull(p.HargaJual)}`,
      getValue:p=>p.PartNumber, searchText:p=>`${p.PartNumber} ${p.PartName}`
    });
  } else if(type==='labor'){
    attachComboSearch('ai_labor_combo', window.__labors, {
      getLabel:l=>`${l.LaborCode} - ${l.LaborName}`, getSub:l=>fmtMoneyFull(l.Harga),
      getValue:l=>l.LaborCode, searchText:l=>`${l.LaborCode} ${l.LaborName}`
    });
  } else if(type==='sublet'){
    attachComboSearch('ai_sublet_combo', window.__sublets, {
      getLabel:s=>s.SubletName,
      getSub:s=>`Harga Beli: ${fmtMoneyFull(s.HargaBeli)} · Harga Jual: ${fmtMoneyFull(s.HargaJual)}`,
      getValue:s=>s.SubletName, searchText:s=>s.SubletName,
      onSelect:s=>{ setFieldValue('ai_sublet_hb', Number(s.HargaBeli)||0); setFieldValue('ai_sublet_hj', Number(s.HargaJual)||0); }
    });
  }
}
// Hapus 1 baris item (Part/Labor/Sublet) yang sudah ditambahkan ke WO. Kalau part-nya sudah "Picked"
// (stok sudah terpotong), backend akan minta role Manager/Super Admin (mengembalikan stok itu sensitif),
// sementara item lain (Pending, Labor, Sublet) bisa dihapus SA sendiri karena tidak menyentuh stok.
async function doDeleteWOItem(woid, type, rowId, itemName){
  if(!confirm('Hapus item "'+itemName+'" dari Work Order ini?')) return;
  const actor = getActor();
  const actionMap = {part:'deleteWOPart', labor:'deleteWOLabor', sublet:'deleteWOSublet'};
  const res = await apiPost(actionMap[type], {WOID:woid, RowID:rowId, ActorRole:actor.role, ActorName:actor.name});
  if(res.success){ toast('Item dihapus'); viewWorkOrder(woid); refreshCurrentView(); } else toast(res.message,true);
}
async function submitAddItem(woid, type){
  let res;
  if(type==='part'){
    const pn = val('ai_part_combo'); const qty = Number(val('ai_part_qty'))||1;
    if(!pn){ toast('Pilih part terlebih dahulu', true); return; }
    const partObj = (window.__parts||[]).find(x=>String(x.PartNumber)===String(pn));
    if(partObj && Number(partObj.StokAkhir)<=0){ toast('Stok part "'+partObj.PartName+'" habis, tidak bisa ditambahkan', true); return; }
    res = await apiPost('addWOPart', {WOID:woid, PartNumber:pn, Qty:qty});
  } else if(type==='labor'){
    const lc = val('ai_labor_combo'); const qty = Number(val('ai_labor_qty'))||1;
    if(!lc){ toast('Pilih jasa terlebih dahulu', true); return; }
    res = await apiPost('addWOLabor', {WOID:woid, LaborCode:lc, Qty:qty});
  } else {
    const name = val('ai_sublet_combo_input').trim(); const qty=Number(val('ai_sublet_qty'))||0;
    const hb=Number(val('ai_sublet_hb'))||0; const hj=Number(val('ai_sublet_hj'))||0;
    if(!name||qty<=0){ toast('Cari/ketik nama sublet dan isi qty', true); return; }
    res = await apiPost('addWOSublet', {WOID:woid, SubletName:name, Qty:qty, HargaBeli:hb, HargaJual:hj});
  }
  if(res.success){ toast('Item ditambahkan'); invalidateWOFormCache(); closeModal(); viewWorkOrder(woid); refreshCurrentView(); } else toast(res.message,true);
}

/* ---- transisi status WO: Dispatching (pilih mekanik), Material Picking (submit part staff), lainnya (konfirmasi + gate role) ---- */
async function openAdvanceModal(woid, fromStatus, toStatus){
  const actor = getActor();
  if(toStatus==='Dispatching'){
    const [ures, wres] = await Promise.all([apiGet('listUsers'), apiGet('getWorkOrder',{id:woid})]);
    const mekaniks = (ures.data||[]).filter(u=>u.Role==='Mekanik' && !(u.Active===false||u.Active==='FALSE'));
    const h = wres.data ? wres.data.header : {};
    const subtotalKotor = Number(h.TotalPart||0)+Number(h.TotalLabor||0)+Number(h.TotalSublet||0);
    const diskonRatio = subtotalKotor>0 ? (Number(h.Diskon||0)/subtotalKotor) : 0;
    const diskonPending = diskonRatio>0.1 && !h.DiskonApprovedBy;
    const blocked = diskonPending && actor.role!=='Manager';
    openModal(`
      <h3 style="margin:0 0 4px;">Dispatching</h3>
      <p class="sub" style="margin:0 0 14px;">WO ${esc(woid)} akan ditugaskan ke mekanik berikut.</p>
      ${actor.role!=='SA' && actor.role!=='Manager' ? `<div class="warn-box">Aksi ini hanya untuk role <b>SA</b> (atau Manager). Anda login sebagai ${esc(actor.role)}.</div>`:''}
      ${diskonPending ? `<div class="danger-box">⚠ Diskon WO ini ${(diskonRatio*100).toFixed(1)}% melebihi 10% dari subtotal dan belum disetujui Manager. ${actor.role==='Manager' ? 'Klik Dispatch untuk sekaligus menyetujui diskon ini.' : 'Minta akun Manager menyetujui diskon dulu sebelum Dispatching (lihat detail WO).'}</div>` : ''}
      ${mekaniks.length===0? `<div class="warn-box">Belum ada karyawan dengan role Mekanik. Tambahkan lewat menu Karyawan / Role, atau ketik nama manual di bawah.</div>
      <label>Nama Mekanik</label><input id="disp_mekanik_manual" placeholder="Nama mekanik">` : `
      <label>Mekanik</label>${comboSearchHtml('disp_mekanik_combo','Cari nama mekanik...')}`}
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:10px;">
        <button class="btn secondary" onclick="closeModal()">Batal</button>
        <button class="btn good" ${blocked?'disabled':''} onclick="confirmDispatch('${woid}', ${mekaniks.length>0})">${icon('approve')} Dispatch</button>
      </div>
    `);
    if(mekaniks.length>0){
      attachComboSearch('disp_mekanik_combo', mekaniks, {getLabel:u=>u.Nama, getValue:u=>u.Nama, searchText:u=>u.Nama});
    }
    return;
  }
  if(toStatus==='Material Picking'){
    const wres = await apiGet('getWorkOrder', {id:woid});
    const parts = (wres.data && wres.data.parts) || [];
    const pending = parts.filter(p=>p.StatusPicking!=='Picked');
    openModal(`
      <h3 style="margin:0 0 4px;">Material Picking</h3>
      <p class="sub" style="margin:0 0 10px;">Part Staff memberikan sparepart sesuai WO ${esc(woid)}, lalu klik Submit. Stok akan otomatis terpotong.</p>
      ${actor.role!=='Part Staff' && actor.role!=='Manager' ? `<div class="warn-box">Aksi ini hanya untuk role <b>Part Staff</b>. Anda login sebagai ${esc(actor.role)}.</div>`:''}
      ${pending.length===0 ? `<div class="warn-box">Semua part sudah dipicking.</div>` :
      pending.map(p=>`<label class="pick-row"><input type="checkbox" class="pick-chk" data-rowid="${esc(p.RowID)}" checked><span class="prname">${esc(p.PartName)}</span><span class="prqty">Qty: ${p.Qty}</span></label>`).join('')}
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:14px;">
        <button class="btn secondary" onclick="closeModal()">Tutup</button>
        ${pending.length>0?`<button class="btn good" onclick="confirmMaterialPicking('${woid}')">Submit Pengambilan Part</button>`:''}
      </div>
    `);
    return;
  }
  const roleMap = {'Completed':'SA','Invoice':'Kasir','Vehicle Delivery':'SA'};
  const requiredRole = roleMap[toStatus];
  const allowed = !requiredRole || actor.role===requiredRole || actor.role==='Manager';
  openModal(`
    <h3 style="margin:0 0 4px;">Set Status: ${esc(toStatus)}</h3>
    <p class="sub" style="margin:0 0 14px;">WO ${esc(woid)} akan diperbarui ke status <b>${esc(toStatus)}</b>.</p>
    ${!allowed?`<div class="warn-box">Aksi ini hanya untuk role <b>${esc(requiredRole)}</b> (atau Manager). Anda login sebagai ${esc(actor.role)}.</div>`:''}
    <div style="display:flex;justify-content:flex-end;gap:10px;">
      <button class="btn secondary" onclick="closeModal()">Batal</button>
      <button class="btn good" onclick="confirmAdvance('${woid}','${toStatus}')">${icon('approve')} Konfirmasi</button>
    </div>
  `);
}
async function confirmDispatch(woid, hasMekanikMaster){
  const actor = getActor();
  const mekanikName = hasMekanikMaster ? val('disp_mekanik_combo') : val('disp_mekanik_manual');
  if(!mekanikName){ toast('Pilih / isi nama mekanik terlebih dahulu', true); return; }
  const res = await apiPost('updateWorkOrderStatus', {WOID:woid, Status:'Dispatching', Mekanik:mekanikName, ActorRole:actor.role, ActorName:actor.name});
  if(res.success){ toast('WO didispatch ke '+mekanikName); closeModal(); closeDrawer(); refreshCurrentView(); } else toast(res.message,true);
}
async function confirmMaterialPicking(woid){
  const actor = getActor();
  const rowIds = Array.from(document.querySelectorAll('.pick-chk:checked')).map(el=>el.dataset.rowid);
  if(rowIds.length===0){ toast('Pilih minimal 1 part', true); return; }
  const res = await apiPost('submitMaterialPicking', {WOID:woid, ActorRole:actor.role, ActorName:actor.name, pickedRowIds:rowIds});
  if(res.success){ toast('Material picking disubmit'); closeModal(); closeDrawer(); refreshCurrentView(); } else toast(res.message,true);
}
async function confirmAdvance(woid, status){
  const actor = getActor();
  const res = await apiPost('updateWorkOrderStatus', {WOID:woid, Status:status, ActorRole:actor.role, ActorName:actor.name});
  if(res.success){ toast('Status diperbarui ke '+status); closeModal(); closeDrawer(); refreshCurrentView(); } else toast(res.message,true);
}

async function confirmCancelWO(woid){

// "Order Query" - gabungan 3 tahap awal WO (New/Dispatching/Material Picking) jadi satu halaman,
// dengan filter Order Status untuk mempersempit tampilan ke salah satu tahap saja. Aksi (Dispatching,

// biasa - setelah aksi berhasil, halaman ini akan refresh sendiri (lihat refreshCurrentView()).
const ORDER_QUERY_STATUSES = ['New', 'Dispatching', 'Material Picking'];
async function renderOrderQuery(){

  const res = await apiGet('listWorkOrder');
  const data = (res.data||[]).filter(w=>ORDER_QUERY_STATUSES.indexOf(w.Status)!==-1).sort((a,b)=>new Date(b.CreatedAt)-new Date(a.CreatedAt));
  setMain(`
    <div class="page-head"><div><h2>Order Query</h2><p>Gabungan tahap New, Dispatching, dan Material Picking - gunakan filter Order Status untuk fokus ke satu tahap (${data.length} WO)</p></div></div>

const PERIOD_OPTIONS = [
  {key:'today', label:'Hari Ini'},
  {key:'yesterday', label:'Kemarin'},
  {key:'this_week', label:'Minggu Ini'},
  {key:'this_month', label:'Bulan Ini'},

function periodSelectorHtml(id, selected, onchange){
  selected = selected || 'this_month';
  const changeAttr = onchange ? ` onchange="${onchange}"` : '';
  return `<select id="${esc(id)}"${changeAttr}>${PERIOD_OPTIONS.map(o=>`<option value="${o.key}" ${o.key===selected?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`;
}
function periodLabel(key){ const o = PERIOD_OPTIONS.find(x=>x.key===key); return o ? o.label : key; }
function trendBadgeHtml(trend){
  if(!trend || trend.pct===null || trend.pct===undefined || !isFinite(trend.pct)) return '';
  const up = trend.delta>=0;
  const pct = Math.abs(trend.pct).toFixed(1);
  const color = up ? '#1f8a3d' : '#a13030';
  const arrow = up ? '▲' : '▼';
  return ` <span style="color:${color};font-size:11.5px;font-weight:700;">${arrow} ${pct}%</span>`;
}

// Export Excel (CSV) untuk Vehicle Delivery: satu baris per item (Part/Labor/Sublet) per WO,
// lengkap dari tanggal, No WO, customer, part, labor, sublet, mekanik, sampai total nilai.
async function exportVehicleDeliveryExcel(){
  toast('Menyiapkan data export...');
  const res = await apiGet('getVehicleDeliveryExport', {});
  if(!res.success){ toast(res.message||'Gagal mengambil data export', true); return; }
  const rows = res.data||[];
  if(rows.length===0){ toast('Belum ada data Vehicle Delivery untuk di-export.', true); return; }
  const headers = ['Tgl WO','Tgl Vehicle Delivery','No WO','Nama Customer','No Polisi','Jenis WO','Tipe Item','Nama Item','No Part','Qty','Harga','Subtotal','Mekanik','SA','Diskon','Total WO'];
  const csvRows = [headers.join(',')];
  rows.forEach(r=>{
    const line = [
      fmtDate(r.TglWO), fmtDate(r.TglVehicleDelivery), r.WOID, r.NamaCustomer, r.NoPolisi, r.JenisWO,
      r.ItemType, r.ItemName, r.PartNumber, r.Qty, r.Harga, r.Subtotal, r.Mekanik, r.SA, r.Diskon, r.TotalWO
    ].map(csvEscape);
    csvRows.push(line.join(','));
  });
  const csvContent = '﻿' + csvRows.join('\r\n'); // BOM supaya Excel baca UTF-8 dengan benar
  const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'Vehicle_Delivery_Export_' + Utilities_todayStr() + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(rows.length+' baris data berhasil di-export.');
}
function csvEscape(v){
  const s = (v===undefined||v===null) ? '' : String(v);
  return /[",\r\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function Utilities_todayStr(){
  const d = new Date();
  return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
}

async function submitEstimasi(){
  const custId = val('wo_cust_id'); const vehId = val('wo_veh_combo');
  if(!custId || !vehId){ toast('Pilih Customer / Kendaraan terlebih dahulu lewat kotak pencarian', true); return; }
  const grossOf = arr => arr.reduce((s,x)=>s+(x.Harga!==undefined?x.Harga:x.HargaJual)*x.Qty,0);
  const discOf = arr => arr.reduce((s,x)=>s+((x.Harga!==undefined?x.Harga:x.HargaJual)*x.Qty)*(x.DiskonPersen||0),0);
  const totalDiskon = discOf(woCart.parts) + discOf(woCart.labors) + discOf(woCart.sublets);
  const actor = getActor();
  const payload = {
    CustomerID: custId, VehicleID: vehId, JenisWO: val('wo_jenis'),
    SA: val('wo_sa'), KM: val('wo_km'), Keluhan: val('wo_keluhan'), Diskon: totalDiskon,
    ActorRole: actor.role, ActorName: actor.name,
    parts: woCart.parts.map(p=>({PartNumber:p.PartNumber, Qty:p.Qty})),
    labors: woCart.labors.map(l=>({LaborCode:l.LaborCode, Qty:l.Qty})),
    sublets: woCart.sublets.map(s=>({SubletName:s.SubletName, Qty:s.Qty, HargaBeli:s.HargaBeli, HargaJual:s.HargaJual}))
  };
  const res = await apiPost('createEstimasi', payload);
  if(res.success){ toast('Estimasi dibuat: '+res.id); closeDrawer(); renderEstimasi(); } else toast(res.message,true);
}

function doCancelEstimasi(estId){
  const reason = prompt('Alasan pembatalan Estimasi ini (mis. "Customer batal service"):');
  if(!reason){ toast('Pembatalan dibatalkan, alasan wajib diisi.', true); return; }
  cancelEstimasiConfirmed(estId, reason);
}
async function cancelEstimasiConfirmed(estId, reason){

async function submitPDS(){
  const custId = val('pds_cust_combo');
  if(!custId){ toast('Pilih Customer terlebih dahulu lewat kotak pencarian', true); return; }
  if(woCart.parts.length===0){ toast('Tambahkan minimal 1 part terlebih dahulu', true); return; }
  const grossOf = arr => arr.reduce((s,x)=>s+x.Harga*x.Qty,0);
  const discOf = arr => arr.reduce((s,x)=>s+(x.Harga*x.Qty)*(x.DiskonPersen||0),0);
  const totalDiskon = discOf(woCart.parts);
  const actor = getActor();
  const payload = {
    CustomerID: custId, Catatan: val('pds_catatan'), Diskon: totalDiskon,
    ActorRole: actor.role, ActorName: actor.name,
    parts: woCart.parts.map(p=>({PartNumber:p.PartNumber, Qty:p.Qty}))
  };
  const res = await apiPost('createPDS', payload);
  if(res.success){ toast('Part Direct Sales dibuat: '+res.id); invalidateWOFormCache(); closeDrawer(); renderPDS(); } else toast(res.message,true);
}

async function printPDS(pdsId){
  const res = await apiGet('getPDS', {id:pdsId});
  if(!res.success){ toast(res.message,true); return; }
  const {header, parts} = res.data;
  const isInvoice = header.Status==='Invoice';
  const subtotal = Number(header.TotalPDS||0); // subtotal setelah diskon - jadi basis PPN
  const PPN_RATE = 0.11;
  const body = `
    <div class="print-grid">
      <div><span>No. ${isInvoice?'Invoice':'Transaksi'}</span><b>${esc(isInvoice?(header.InvoiceNumber||header.PDSID):header.PDSID)}</b></div>
      <div><span>Tanggal</span><b>${fmtDate(header.TglPDS)}</b></div>

      ${(parts||[]).map(p=>`<tr><td>${esc(p.PartName)}</td><td class="num">${p.Qty}</td><td class="num">${fmtMoneyFull(p.HargaSatuan)}</td><td class="num">${fmtMoneyFull(p.Subtotal)}</td></tr>`).join('') || '<tr><td colspan="4">Tidak ada part</td></tr>'}
    </table>
    ${isInvoice ? `<div class="print-actions" style="max-width:none;margin:0 0 6px;justify-content:flex-start;">
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;">
        <input type="checkbox" id="inv_ppn_toggle" onchange="toggleInvoicePPN()"> Sertakan PPN 11%
      </label>
    </div>` : ''}
    <div class="print-grid" style="grid-template-columns:1fr;text-align:right;">
      ${Number(header.Diskon||0)>0?`<div style="display:flex;justify-content:flex-end;gap:18px;"><span>Subtotal</span><b>${fmtMoneyFull(header.TotalPart)}</b></div>
      <div style="display:flex;justify-content:flex-end;gap:18px;"><span>Diskon</span><b>- ${fmtMoneyFull(header.Diskon)}</b></div>`:''}
      ${isInvoice ? `<div style="display:flex;justify-content:flex-end;gap:18px;"><span>Subtotal Setelah Diskon</span><b id="inv_subtotal_label">-</b></div>
      <div id="inv_ppn_row" style="display:none;justify-content:flex-end;gap:18px;"><span>PPN (11%)</span><b id="inv_ppn_label">-</b></div>` : ''}
    </div>
    ${isInvoice ? `<div class="print-total">TOTAL INVOICE: <span id="inv_grand_total">-</span></div>` : `<div class="print-total">TOTAL TRANSAKSI: ${fmtMoneyFull(header.TotalPDS)}</div>`}
    ${isInvoice ? `<p style="font-size:11.5px;color:#555;">Invoice ini sah tanpa memerlukan cap/stempel apabila dicetak dari sistem.</p>` : `<p style="font-size:11.5px;color:#555;">*Dokumen ini belum berupa Invoice resmi - proses transaksi ke status Invoice terlebih dahulu di menu Part Direct Sales.</p>`}
    <div class="print-sign">
      <div class="box"><div class="line"></div>Kasir/Part Staff<br>(${esc(header.InvoicedBy||header.CreatedBy||'-')})</div>
      <div class="box"><div class="line"></div>Customer</div>
    </div>
  `;
  const script = isInvoice ? `<script>
    const INV_SUBTOTAL = ${Number(subtotal)||0};
    const INV_PPN_RATE = ${PPN_RATE};
    function fmtIDR(n){ return 'Rp ' + Math.round(n).toLocaleString('id-ID'); }
    function toggleInvoicePPN(){
      const on = document.getElementById('inv_ppn_toggle').checked;
      const ppn = on ? INV_SUBTOTAL * INV_PPN_RATE : 0;
      document.getElementById('inv_subtotal_label').textContent = fmtIDR(INV_SUBTOTAL);
      document.getElementById('inv_ppn_row').style.display = on ? 'flex' : 'none';
      document.getElementById('inv_ppn_label').textContent = fmtIDR(ppn);
      document.getElementById('inv_grand_total').textContent = fmtIDR(INV_SUBTOTAL + ppn);
    }
    toggleInvoicePPN();
  <\/script>` : '';
  openPrintWindow(buildPrintDocument(isInvoice?'INVOICE':'NOTA PART DIRECT SALES', isInvoice?(header.InvoiceNumber||header.PDSID):header.PDSID, body, getPrintCss(), script));

async function submitReminderLog(r){
  const status = val('rem_status');
  if(!status){ toast('Pilih dulu hasil follow up.', true); return; }
  if(status==='Ditunda' && !val('rem_snooze_date')){ toast('Isi dulu tanggal tunda.', true); return; }
  const actor = getActor();
  const res = await apiPost('updateReminderLog', {
    ReminderID: r.ReminderID || '', VehicleID: r.VehicleID, NoPolisi: r.NoPolisi, CustomerID: r.CustomerID,
    NamaCustomer: r.NamaCustomer, NoHP: r.NoHP, LastServiceDate: r.LastServiceDate, LastKM: r.LastKM, DueReason: r.DueReason,
    Status: status, SnoozeUntil: val('rem_snooze_date'), Catatan: val('rem_catatan'), ActorName: actor.name
  });
  if(!res.success){ toast(res.message,true); return; }
  toast('Hasil reminder tersimpan.');
  renderReminderDue();
  // Integrasi Reminder -> Booking: kalau CRO memilih hasil "Booking Dibuat", langsung GANTI ISI drawer
  // yang sama ini jadi form Booking dengan Customer/Kendaraan sudah terisi (SourceReminderID ikut dibawa
  // supaya tetap tertelusuri asalnya) - jadi CRO tidak perlu cari ulang customer yang sama di menu Booking.
  // SENGAJA TIDAK memanggil closeDrawer() dulu di sini: closeDrawer() punya jeda 250ms sebelum benar-benar
  // menyembunyikan overlay drawer-bg - kalau drawer baru (formBooking) dibuka SEBELUM jeda itu selesai,
  // timeout closeDrawer() yang lama akan menyembunyikan overlay drawer yang baru saja dibuka. formBooking()
  // sendiri memanggil openDrawer() yang aman dipakai untuk mengganti isi drawer yang sedang terbuka.
  if(status==='Booking Dibuat'){
    formBooking({ CustomerID:r.CustomerID, VehicleID:r.VehicleID, Keluhan:'Servis berkala (hasil tindak lanjut Reminder)', SourceReminderID: res.id || r.ReminderID || '' });
  } else {
    closeDrawer();
  }
}

   Bisa dibuat manual dari sini (tombol "Buat Booking"), ATAU otomatis dibukakan formnya oleh
   submitReminderLog() saat CRO memilih hasil "Booking Dibuat" di layar Reminder - SourceReminderID
   ikut terbawa supaya booking ini tetap tertelusuri lahir dari tindak lanjut reminder yang mana.
   Alur status: Booked -> Confirmed -> Checked-in (TERMINAL - backend otomatis membuat shell Estimasi
   kosong lewat checkinBooking(), jadi begitu customer datang, SA tinggal buka menu "Create New Order (WO)"
   dan muat nomor Estimasi itu lewat kolom "Muat dari Nomor Estimasi" - Customer/Kendaraan otomatis terisi
   dan SA baru bisa menambahkan part/jasa/sublet DI SITU sebelum disimpan jadi WO beneran. Menu Estimasi
   sendiri SENGAJA read-only (cuma lihat/cetak/batalkan) - menambah item bukan dilakukan dari sana, sama
   seperti Estimasi manual manapun). Cabang keluar: Cancelled / No Show. */
const BOOKING_STATUS_BADGE = {'Booked':'s4','Confirmed':'s2','Checked-in':'good','Cancelled':'critical','No Show':'critical'};
// Jaga-jaga: kalau JamBooking sempat kena konversi otomatis Google Sheets jadi Date sebelum backend
// diperbaiki/Super Admin klik "Migrasi Kolom Sheet" (lihat forceJamBookingAsText_() di Code.gs), nilainya
// akan berupa string tanggal aneh (mis. "1899-12-30T02:47:56.000Z") - JANGAN ditampilkan apa adanya karena
// membingungkan, tampilkan "-" saja sampai diperbaiki, drpd menampilkan jam yang salah/meleset.
function fmtJamBooking(v){
  if(!v) return '-';
  if(/^\d{1,2}:\d{2}/.test(String(v))) return String(v);
  return '-';
}

  setMain(`

    ], 'TglBooking', null, {keys:['BookingID','NamaCustomer','NoPolisi','Mekanik'], placeholder:'Cari No. Booking / Customer / No Polisi / Mekanik...'})}
    <div class="panel">${dataTable({
      id:'booking', rows:data, searchKeys:['BookingID','NamaCustomer','NoPolisi','Mekanik'], showSearch:false,
      columns:[
        {key:'BookingID', label:'No. Booking', render:b=>`<span class="link-id" onclick='viewBooking(${JSON.stringify(b)})'>${esc(b.BookingID)}</span>`},
        {key:'TglBooking', label:'Tanggal', render:b=>fmtDate(b.TglBooking)},

async function formPO(){
  const pres = await apiGet('listPart');

  // Hanya part yang sudah punya Harga Beli di Part Master yang bisa di-PO-kan. Pakai parseMoneyLoose
  // (bukan Number() polos) supaya part yang Harga Beli-nya pernah diketik manual di sheet dengan format

        <div><label style="font-size:11px;display:block;">Harga Beli</label><span id="po_part_harga_preview" class="muted" style="font-size:12px;min-width:110px;white-space:nowrap;display:inline-block;padding:9px 0;">-</span></div>
        <button class="btn accent sm" onclick="addPOPart()">+ Add</button>
      </div>
      <p style="font-size:11px;color:#666;margin:2px 0 0;">Harga otomatis mengikuti Harga Beli di Part Master (tidak bisa diubah manual di sini). Ketik No. Part atau Nama Part untuk mencari (lebih cepat dari scroll daftar kalau part-nya ribuan).</p>
      `}
      <div id="po_part_list"></div>

function updatePOPartHargaPreview(){
  const pn = val('po_part_combo');
  const part = window.__parts.find(p=>String(p.PartNumber)===String(pn));
  const el = document.getElementById('po_part_harga_preview');

function addPOPart(){
  const pn = val('po_part_combo'); const qty = Number(val('po_part_qty'))||1;
  const part = window.__parts.find(p=>String(p.PartNumber)===String(pn));
  const harga = part ? parseMoneyLoose(part.HargaBeli) : 0;

  poCart.push({PartNumber:pn, PartName:part.PartName, QtyOrder:qty, HargaSatuan:harga});
  setFieldValue('po_part_combo',''); const inp=document.getElementById('po_part_combo_input'); if(inp) inp.value='';
  updatePOPartHargaPreview();
  renderPOCart();
}

  const box = document.getElementById('po_part_list');

async function viewPO(ponumber){
  const actor = getActor();

  if(!res.success){ toast(res.message,true); return; }
  const {header, details} = res.data;
  window.__curPOHeader = header;
  const stages = ['PO Created','Approval PO','PO Submit Order','Received'];
  const curIdx = header.Status==='Rejected' ? -1 : stages.indexOf(header.Status)>=0 ? stages.indexOf(header.Status) : (header.Status==='Partial Received'?2.5:0);
  openDrawer(`
    <div class="drawer-head"><h3>PO ${header.PONumber}</h3><button class="drawer-close" onclick="closeDrawer()">&times;</button></div>

      <div class="stepper">${stages.map((s,i)=>`<div class="step ${i<curIdx?'done':''} ${i===Math.floor(curIdx) && curIdx%1!==0 ? '':i===curIdx?'current':''}"><div class="circle">${i<curIdx?'✓':i+1}</div><div class="stitle">${s}</div></div>`).join('')}</div>`}
      ${header.Status==='Partial Received' ? `<div class="warn-box">PO ini masih <b>Partial Received</b> — sengaja tetap terbuka supaya sisa barang yang belum datang bisa terus di-followup lewat menu Penerimaan Part. Kalau sisanya sudah pasti tidak akan datang lagi (dibatalkan vendor), gunakan tombol <b>Tutup PO</b> di bawah.</div>`:''}
      <div class="grid2">
        <div class="kv"><span>Supplier</span><b>${esc(header.Supplier)}</b></div>

async function loadPODetailForGR(){
  const ponumber = val('gr_po');
  const [res, pres] = await Promise.all([apiGet('getPO', {id:ponumber}), apiGet('listPart')]);
  const details = res.data.details;
  window.__grDetails = details;
  // Peta PartNumber -> StokAkhir dari Inventory Master (Part_Master), untuk kolom "Stok Saat Ini" (read-only).
  const stokMap = {};
  (pres.data||[]).forEach(p=> stokMap[String(p.PartNumber)] = Number(p.StokAkhir)||0);
  const rowsHtml = ['<h3 style="font-size:13.5px;">Detail Part</h3><p class="sub" style="margin-top:-4px;">Kondisi <b>OK</b> akan lanjut ke Sign In (isi rak) untuk masuk stok. Kondisi <b>NG</b> tidak diproses ke stok. Isi qty yang benar-benar diterima pada kolom <b>Diterima</b>. Baris yang sudah diterima 100% otomatis terkunci (part tsb tetap "open" untuk baris lain di PO yang sama sampai semuanya lengkap).</p><table><tr><th>Part</th><th>Order</th><th>Sudah Diterima</th><th>Diterima</th><th>Stok Saat Ini (Inventory Master)</th><th>Kondisi</th></tr>'];
  details.forEach(function(d,i){
    const stokSaatIni = stokMap[String(d.PartNumber)] || 0;
    const sisaLine = Math.max(0, Number(d.QtyOrder) - Number(d.QtyDiterima||0));
    const lineDone = sisaLine === 0;
    rowsHtml.push('<tr' + (lineDone?' style="opacity:.55;"':'') + '><td>', esc(d.PartName), lineDone?' <span class="muted" style="font-size:10.5px;">(lunas)</span>':'', '</td><td>', d.QtyOrder, '</td><td>', (d.QtyDiterima||0), '</td>',
      '<td><input type="number" id="gr_qty_' + i + '" style="width:64px;margin:0;" ' + (lineDone?'disabled':'') + '></td>',
      '<td><input type="text" value="' + stokSaatIni + '" disabled style="width:70px;margin:0;background:var(--surface-3);color:var(--ink-2);"></td>',
      '<td><select id="gr_kondisi_' + i + '" style="margin:0;" ' + (lineDone?'disabled':'') + '><option value="OK">OK</option><option value="NG">NG (Rusak/Tidak Sesuai)</option></select></td></tr>');
  });
  rowsHtml.push('</table>');
  document.getElementById('gr_detail_list').innerHTML = rowsHtml.join('');
  // isi qty sisa lewat DOM property (bukan lewat teks HTML)
  details.forEach(function(d,i){
    const sisa = Math.max(0, Number(d.QtyOrder) - Number(d.QtyDiterima||0));
    setFieldValue('gr_qty_'+i, sisa);
  });
}

async function submitSignInBatch(){
  const actor = getActor();
  const items = [];
  let missingLokasi = false;
  document.querySelectorAll('.signin-chk:checked').forEach(function(chk){
    const i = Number(chk.dataset.i);
    const d = window.__signinData[i];
    const lokasi = val('signin_rak_'+i).trim();
    if(!lokasi){ missingLokasi = true; return; }
    items.push({RowID:d.RowID, Lokasi:lokasi});
  });
  if(missingLokasi){ toast('Isi lokasi rak untuk semua part yang dicentang', true); return; }
  if(items.length===0){ toast('Pilih minimal 1 part', true); return; }
  const res = await apiPost('submitSignIn', {items, ActorName:actor.name});
  if(res.success){ toast(res.jumlah+' part berhasil masuk ke stok'); renderSignIn(); } else toast(res.message,true);
}

        <td>${esc(d.PartNumber)} - ${esc(d.PartName)}</td>
        <td class="num">${d.QtySystem}</td>
        <td class="num">${isDraft?`<input type="number" id="opn_qty_${i}" style="width:80px;margin:0;text-align:right;" value="${d.QtyFisik!==''?d.QtyFisik:''}">`:d.QtyFisik}</td>
        <td class="num" id="opn_selisih_${i}">${d.Selisih!==''?(d.Selisih>0?'+':'')+d.Selisih:'-'}</td>
        <td>${isDraft?`<input id="opn_ket_${i}" style="margin:0;" value="${esc(d.Keterangan||'')}">`:esc(d.Keterangan||'-')}</td>
      </tr>`).join('')}

    </div>

      <h3 style="font-size:13.5px;margin:0 0 8px;">Usulan Part Loss dari Opname ini</h3>
      <table><tr><th>Part</th><th class="num">Selisih</th><th>Tipe</th><th>Status</th><th>Oleh</th></tr>

/* ================= LAPORAN: REVENUE VS GP ================= */
// Catatan metodologi: Revenue = Total WO (sudah bersih diskon) pada WO berstatus Invoice/Vehicle Delivery.
// COGS didekati dari Qty Part x Cost Price TERKINI (moving average) + Qty Sublet x Harga Beli vendor.
// Labor dianggap tanpa COGS (murni margin jasa). Pendekatan ini praktis karena histori cost per transaksi
// tidak disimpan terpisah - kalau butuh akurasi penuh, Cost Price perlu direkam per baris WO saat WO dibuat.
async function renderRevenueGPReport(){
  setMain(skeletonRows(4));
  setMain(`
    <div class="page-head"><div><h2>Revenue vs Gross Profit</h2><p>Revenue = Total WO setelah diskon. GP = Revenue - estimasi COGS (Part x Cost Price + Sublet x Harga Beli). Labor dianggap tanpa COGS.</p></div>
      <button class="btn outline sm" onclick="exportRevenueGPExcel()">⬇ Export Excel</button>
    </div>
    <div class="panel" style="margin-bottom:12px;">
      <div class="row-line" style="flex-wrap:wrap;gap:10px;align-items:flex-end;">
        <div><label style="font-size:11px;display:block;">Periode</label>${periodSelectorHtml('rgp_period','this_month')}</div>
        <div><label style="font-size:11px;display:block;">atau Dari Tanggal</label><input type="date" id="rgp_from" style="width:150px;"></div>
        <div><label style="font-size:11px;display:block;">Ke Tanggal</label><input type="date" id="rgp_to" style="width:150px;"></div>
        <button class="btn outline sm" onclick="loadRevenueGPReport()">Terapkan Filter</button>
        <button class="btn ghost sm" onclick="setFieldValue('rgp_from','');setFieldValue('rgp_to','');setFieldValue('rgp_period','this_month');loadRevenueGPReport();">Reset</button>
      </div>
    </div>
    <div id="rgp_result"></div>
  `);
  loadRevenueGPReport();
}
async function loadRevenueGPReport(){
  const el = document.getElementById('rgp_result');
  el.innerHTML = skeletonRows(3);
  const from = val('rgp_from'), to = val('rgp_to');
  const params = (from || to) ? {from, to} : {period: val('rgp_period')||'this_month'};
  const res = await apiGet('getRevenueGPReport', params);
  if(!res.success){ el.innerHTML = `<div class="panel">${emptyState(res.message)}</div>`; return; }
  const {rows, monthly, totals, trend, bySource} = res.data;
  window.__rgp_rows = rows;
  const barItems = [];
  monthly.forEach(m=>{
    barItems.push({label: m.month+' - Revenue', value: Math.round(m.revenue), colorVar:'s1'});
    barItems.push({label: m.month+' - GP', value: Math.round(m.gp), colorVar:'s3'});
  });
  el.innerHTML = `
    <div class="cards">
      <div class="stat-card"><div class="label">Total Revenue</div><div class="value">${fmtMoney(totals.revenue)}${trend?trendBadgeHtml(trend.revenue):''}</div></div>
      <div class="stat-card"><div class="label">Estimasi COGS</div><div class="value">${fmtMoney(totals.cogs)}${trend?trendBadgeHtml(trend.cogs):''}</div></div>
      <div class="stat-card"><div class="label">Gross Profit</div><div class="value">${fmtMoney(totals.gp)}${trend?trendBadgeHtml(trend.gp):''}</div></div>
      <div class="stat-card"><div class="label">GP Margin</div><div class="value">${totals.margin.toFixed(1)}%</div></div>
    </div>
    ${bySource ? `
    <div class="panel" style="margin-bottom:12px;">
      <h3 style="font-size:13.5px;">Kontribusi per Sumber</h3>
      <p class="sub">Perbandingan Service (Work Order) vs Part Direct Sales</p>
      <div style="overflow-x:auto;"><table>
        <tr><th>Sumber</th><th class="num">Revenue</th><th class="num">% Revenue</th><th class="num">GP</th><th class="num">% GP</th><th class="num">Margin</th></tr>
        <tr><td>Service (Work Order)</td><td class="num">${fmtMoneyFull(bySource.service.revenue)}</td><td class="num">${bySource.service.revenuePct.toFixed(1)}%</td>
          <td class="num">${fmtMoneyFull(bySource.service.gp)}</td><td class="num">${bySource.service.gpPct.toFixed(1)}%</td><td class="num">${bySource.service.margin.toFixed(1)}%</td></tr>
        <tr><td>Part Direct Sales</td><td class="num">${fmtMoneyFull(bySource.partSales.revenue)}</td><td class="num">${bySource.partSales.revenuePct.toFixed(1)}%</td>
          <td class="num">${fmtMoneyFull(bySource.partSales.gp)}</td><td class="num">${bySource.partSales.gpPct.toFixed(1)}%</td><td class="num">${bySource.partSales.margin.toFixed(1)}%</td></tr>
      </table></div>
    </div>` : ''}
    ${barItems.length>0?`<div class="panel"><h3 style="font-size:13.5px;">Revenue vs GP per Bulan</h3><div id="rgp_bar"></div></div>`:''}
    <div class="panel">
      ${rows.length===0 ? emptyState('Belum ada transaksi yang diinvoice pada rentang ini.') : `<div style="overflow-x:auto;"><table><tr><th>No</th><th>Sumber</th><th>Tgl Invoice</th><th>Customer</th><th class="num">Revenue</th><th class="num">COGS</th><th class="num">GP</th><th class="num">Margin</th></tr>
      ${rows.map(r=>`<tr><td><span class="link-id" onclick="${r.Source==='Part Direct Sales'?`viewPDS('${r.ID}')`:`viewWorkOrder('${r.ID}')`}">${esc(r.ID)}</span></td><td>${esc(r.Source)}</td><td>${fmtDate(r.TglInvoice)}</td><td>${esc(r.NamaCustomer)}</td>
        <td class="num">${fmtMoneyFull(r.Revenue)}</td><td class="num">${fmtMoneyFull(r.COGS)}</td><td class="num">${fmtMoneyFull(r.GP)}</td><td class="num">${r.Margin.toFixed(1)}%</td></tr>`).join('')}
      </table></div>`}
    </div>
  `;
  if(barItems.length>0){
    const bc = hBarChart(barItems, {fmt:fmtMoney});
    const barEl = document.getElementById('rgp_bar');
    barEl.innerHTML = bc.svg;
    attachHBarChart(barEl, bc);
    attachBarTooltip(barEl, barItems.map(it=>({label:it.label, value:fmtMoneyFull(it.value)})));
  }
}
function exportRevenueGPExcel(){
  const rows = window.__rgp_rows||[];
  if(rows.length===0){ toast('Belum ada data untuk di-export.', true); return; }
  const headers = ['No','Sumber','Tgl Invoice','Customer','Revenue','COGS','GP','Margin (%)'];
  const csvRows = [headers.join(',')];
  rows.forEach(r=>{
    csvRows.push([r.ID, r.Source, fmtDate(r.TglInvoice), r.NamaCustomer, r.Revenue, r.COGS, r.GP, r.Margin.toFixed(1)].map(csvEscape).join(','));
  });
  downloadCsv(csvRows, 'Revenue_vs_GP_Report_'+Utilities_todayStr()+'.csv');
  toast(rows.length+' baris data berhasil di-export.');
}
function downloadCsv(csvRows, filename){
  const csvContent = '﻿' + csvRows.join('\r\n');
  const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ================= LAPORAN: UNIT ENTRY (VIN UNIK PER HARI) ================= */
// Kendaraan (No Rangka/VIN) yang sama, masuk WO di hari yang SAMA, hanya dihitung SATU kali sebagai
// Unit Entry - meski tercatat lebih dari satu Work Order pada hari itu (mis. WO susulan/tambahan).
async function renderUnitEntryReport(){
  setMain(skeletonRows(4));
  setMain(`
    <div class="page-head"><div><h2>Unit Entry (VIN Unik per Hari)</h2><p>Kendaraan dengan No Rangka (VIN) sama yang masuk di hari yang sama dihitung sebagai SATU Unit Entry.</p></div>
      <button class="btn outline sm" onclick="exportUnitEntryExcel()">⬇ Export Excel</button>
    </div>
    <div class="panel" style="margin-bottom:12px;">
      <div class="row-line" style="flex-wrap:wrap;gap:10px;align-items:flex-end;">
        <div><label style="font-size:11px;display:block;">Periode</label>${periodSelectorHtml('ue_period','this_month')}</div>
        <div><label style="font-size:11px;display:block;">atau Dari Tanggal</label><input type="date" id="ue_from" style="width:150px;"></div>
        <div><label style="font-size:11px;display:block;">Ke Tanggal</label><input type="date" id="ue_to" style="width:150px;"></div>
        <button class="btn outline sm" onclick="loadUnitEntryReport()">Terapkan Filter</button>
        <button class="btn ghost sm" onclick="setFieldValue('ue_from','');setFieldValue('ue_to','');setFieldValue('ue_period','this_month');loadUnitEntryReport();">Reset</button>
      </div>
    </div>
    <div id="ue_result"></div>
  `);
  loadUnitEntryReport();
}
async function loadUnitEntryReport(){
  const el = document.getElementById('ue_result');
  el.innerHTML = skeletonRows(3);
  const from = val('ue_from'), to = val('ue_to');
  const params = (from || to) ? {from, to} : {period: val('ue_period')||'this_month'};
  const res = await apiGet('getUnitEntryReport', params);
  if(!res.success){ el.innerHTML = `<div class="panel">${emptyState(res.message)}</div>`; return; }
  const {uniqueEntries, monthly, totalUniqueEntries, totalWOTercatat, totalDuplikatHariSama, trend} = res.data;
  window.__ue_rows = uniqueEntries;
  el.innerHTML = `
    <div class="cards">
      <div class="stat-card"><div class="label">Total Unit Entry (Unik)</div><div class="value">${totalUniqueEntries}${trend?trendBadgeHtml(trend.uniqueEntries):''}</div></div>
      <div class="stat-card"><div class="label">Total WO Tercatat</div><div class="value">${totalWOTercatat}</div></div>
      <div class="stat-card"><div class="label">Tidak Dihitung Ganda</div><div class="value">${totalDuplikatHariSama}</div></div>
    </div>
    ${monthly.length>1?`<div class="panel"><h3 style="font-size:13.5px;">Tren Unit Entry per Bulan</h3><div id="ue_line"></div></div>`:''}
    <div class="panel">${dataTable({
      id:'unitentry', rows:uniqueEntries, searchKeys:['VIN','NoPolisi','NamaCustomer'],
      columns:[
        {key:'TglMasuk', label:'Tgl Masuk', render:e=>fmtDate(e.TglMasuk)},
        {key:'NoPolisi', label:'No Polisi'}, {key:'VIN', label:'No Rangka (VIN)'},
        {key:'NamaCustomer', label:'Customer'},
        {key:'WOIDs', label:'Jumlah WO', numeric:true, render:e=>e.WOIDs.length===1
          ? `<span class="link-id" onclick="viewWorkOrder('${e.WOIDs[0]}')">${esc(e.WOIDs[0])}</span>`
          : `<span class="badge muted" title="${e.WOIDs.map(esc).join(', ')}"><span class="dot"></span>${e.WOIDs.length} WO</span>`}
      ]
    })}</div>
  `;
  initTable('unitentry');
  if(monthly.length>1){
    const lc = lineChart(monthly.map(m=>m.month), monthly.map(m=>m.count));
    const lineEl = document.getElementById('ue_line');
    lineEl.innerHTML = lc.svg;
    attachLineChart(lineEl, lc);
    attachLineTooltip(lineEl, lc.pts);
  }
}
function exportUnitEntryExcel(){
  const rows = window.__ue_rows||[];
  if(rows.length===0){ toast('Belum ada data untuk di-export.', true); return; }
  const headers = ['Tgl Masuk','No Polisi','No Rangka (VIN)','Customer','Jumlah WO','Daftar No WO'];
  const csvRows = [headers.join(',')];
  rows.forEach(r=>{
    csvRows.push([fmtDate(r.TglMasuk), r.NoPolisi, r.VIN, r.NamaCustomer, r.WOIDs.length, r.WOIDs.join('; ')].map(csvEscape).join(','));
  });
  downloadCsv(csvRows, 'Unit_Entry_Report_'+Utilities_todayStr()+'.csv');
  toast(rows.length+' baris data berhasil di-export.');
}

/* ================= GLOBAL SEARCH (shortcut ke Kartu Stok / WO / PO) ================= */
document.getElementById('globalSearch').addEventListener('keydown', async e=>{
  if(e.key!=='Enter') return;
  const q = e.target.value.trim();
  if(!q) return;
  toast('Mencari "'+q+'"...');
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  document.querySelector('[data-view="partmaster"]').classList.add('active');
  document.getElementById('pageTitle').textContent = 'Part Master';
  await renderPartMaster();
  if(window.__tbl_part) window.__tbl_part.search(q);
});
