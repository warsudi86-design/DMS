<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMS Integrasi — Prima Wuling Aftersales</title>
<style>
/* ============ DESIGN TOKENS (dark theme, palet kategorikal & status tervalidasi) ============ */
:root{
  --page:#0d0d0d; --surface:#17181c; --surface-2:#1f2127; --surface-3:#282b33;
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.14);
  --ink:#ffffff; --ink-2:#c3c2b7; --ink-muted:#898781;
  --brand:#3987e5; --brand-2:#9085e9;
  /* kategorikal (urutan tetap, jangan diacak) */
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#0ca30c; --s7:#9085e9; --s8:#e66767;
  /* status (dicadangkan, tidak dipakai utk kategori lain) */
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --radius:14px; --radius-sm:9px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:
  radial-gradient(1200px 600px at 90% -10%, rgba(57,135,229,.10), transparent),
  radial-gradient(900px 500px at -10% 110%, rgba(144,133,233,.08), transparent),
  var(--page);color:var(--ink);min-height:100vh;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:10px;}
::-webkit-scrollbar-track{background:transparent;}

.app{display:flex;min-height:100vh;}

/* ---------- SIDEBAR ---------- */
.sidebar{width:242px;flex-shrink:0;background:rgba(23,24,28,.92);backdrop-filter:blur(10px);
  border-right:1px solid var(--border);padding:18px 12px;position:sticky;top:0;height:100vh;
  overflow-y:auto;transition:width .2s ease;}
.sidebar.collapsed{width:72px;}
.sidebar.collapsed .label,.sidebar.collapsed .nav-title,.sidebar.collapsed .brand-text{display:none;}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px;padding:4px 6px;}
.brand .logo{width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:13px;box-shadow:0 4px 14px rgba(57,135,229,.35);}
.brand-text h1{font-size:14px;margin:0;line-height:1.2;font-weight:700;}
.brand-text span{display:block;font-size:10.5px;color:var(--ink-muted);margin-top:1px;}
.collapse-btn{margin-left:auto;background:none;border:none;color:var(--ink-muted);cursor:pointer;padding:4px;
  border-radius:6px;display:flex;}
.collapse-btn:hover{background:var(--surface-2);color:var(--ink);}
.nav-title{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-muted);
  margin:16px 10px 6px;font-weight:700;}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;cursor:pointer;
  color:var(--ink-2);font-size:13.5px;transition:.15s;position:relative;margin-bottom:2px;white-space:nowrap;}
.nav-item svg{flex-shrink:0;width:18px;height:18px;}
.nav-item:hover{background:var(--surface-2);color:var(--ink);}
.nav-item.active{background:linear-gradient(135deg,rgba(57,135,229,.22),rgba(144,133,233,.16));color:#fff;font-weight:600;}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));}
.nav-badge{margin-left:auto;background:var(--critical);color:#fff;font-size:10px;font-weight:800;
  padding:1px 6px;border-radius:20px;}

/* ---------- MAIN ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;gap:16px;padding:14px 26px;border-bottom:1px solid var(--border);
  background:rgba(13,13,13,.6);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;}
.topbar .crumb{font-size:12px;color:var(--ink-muted);}
.topbar h2{margin:0;font-size:18px;font-weight:700;}
.searchbox{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:10px;padding:7px 12px;width:260px;}
.searchbox input{background:none;border:none;outline:none;color:var(--ink);font-size:13px;width:100%;}
.searchbox svg{width:15px;height:15px;color:var(--ink-muted);flex-shrink:0;}
.bell{position:relative;width:34px;height:34px;border-radius:10px;background:var(--surface-2);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink-2);cursor:pointer;}
.bell .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--critical);
  box-shadow:0 0 0 2px var(--surface);}
.avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--s7),var(--s5));
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
.content{padding:22px 26px 40px;overflow-y:auto;}

/* ---------- COMMON ---------- */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
.page-head h2{margin:0;font-size:21px;font-weight:800;}
.page-head p{margin:4px 0 0;color:var(--ink-muted);font-size:13px;}
.btn{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border:none;padding:10px 16px;
  border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;transition:.15s;display:inline-flex;align-items:center;gap:7px;}
.btn svg{width:15px;height:15px;}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn.secondary{background:var(--surface-2);border:1px solid var(--border-strong);}
.btn.good{background:linear-gradient(135deg,#0ca30c,#0a8a0a);}
.btn.critical{background:linear-gradient(135deg,#d03b3b,#a92e2e);}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px;}
.btn.ghost{background:transparent;border:1px solid var(--border-strong);color:var(--ink-2);}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px 18px;
  position:relative;overflow:hidden;}
.stat-card .icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.stat-card .icon svg{width:17px;height:17px;}
.stat-card .label{font-size:12px;color:var(--ink-muted);font-weight:600;}
.stat-card .value{font-size:25px;font-weight:800;margin-top:3px;}
.stat-card .delta{font-size:11.5px;margin-top:4px;font-weight:700;display:flex;align-items:center;gap:4px;}
.delta.up{color:var(--good);} .delta.down{color:var(--critical);} .delta.flat{color:var(--ink-muted);}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:19px;
  margin-bottom:18px;box-shadow:var(--shadow);}
.panel h3{margin:0 0 4px;font-size:14.5px;font-weight:700;}
.panel .sub{font-size:11.5px;color:var(--ink-muted);margin:0 0 14px;}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:1000px){.grid2{grid-template-columns:1fr;}}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:10px 10px;text-align:left;border-bottom:1px solid var(--border);}
th{color:var(--ink-muted);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  cursor:pointer;user-select:none;white-space:nowrap;}
th:hover{color:var(--ink);}
th .sort-arrow{font-size:9px;margin-left:3px;opacity:.6;}
tbody tr{transition:.1s;}
tbody tr:hover td{background:rgba(255,255,255,.025);}
td.num{font-variant-numeric:tabular-nums;}

.badge{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.badge .dot{width:6px;height:6px;border-radius:50%;}
.badge.s1{background:rgba(57,135,229,.16);color:#7db1ee;} .badge.s1 .dot{background:var(--s1);}
.badge.s2{background:rgba(217,89,38,.16);color:#f0946a;} .badge.s2 .dot{background:var(--s2);}
.badge.s3{background:rgba(25,158,112,.16);color:#5fd2a8;} .badge.s3 .dot{background:var(--s3);}
.badge.s4{background:rgba(201,133,0,.18);color:#f0b53d;} .badge.s4 .dot{background:var(--s4);}
.badge.s5{background:rgba(213,81,129,.16);color:#ef94b7;} .badge.s5 .dot{background:var(--s5);}
.badge.s6{background:rgba(12,163,12,.16);color:#5fd25f;} .badge.s6 .dot{background:var(--s6);}
.badge.s7{background:rgba(144,133,233,.18);color:#bdb6f5;} .badge.s7 .dot{background:var(--s7);}
.badge.good{background:rgba(12,163,12,.16);color:#5fd25f;} .badge.good .dot{background:var(--good);}
.badge.warn{background:rgba(250,178,25,.18);color:#fcd374;} .badge.warn .dot{background:var(--warn);}
.badge.critical{background:rgba(208,59,59,.18);color:#f28080;} .badge.critical .dot{background:var(--critical);}
.badge.muted{background:var(--surface-3);color:var(--ink-muted);} .badge.muted .dot{background:var(--ink-muted);}

.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:2px;}
.tab{padding:9px 15px;cursor:pointer;font-size:13px;color:var(--ink-muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--ink);border-color:var(--brand);}

label{font-size:12px;color:var(--ink-muted);display:block;margin-bottom:5px;font-weight:600;}
input,select,textarea{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--border-strong);
  background:var(--surface-2);color:var(--ink);font-size:13px;margin-bottom:13px;font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);}
textarea{resize:vertical;min-height:60px;}

/* ---------- DRAWER (slide-in panel, ganti modal utk form) ---------- */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:60;}
.drawer-bg.show{display:block;}
.drawer{position:fixed;top:0;right:-720px;width:680px;max-width:94vw;height:100vh;background:var(--surface);
  border-left:1px solid var(--border-strong);z-index:61;transition:right .25s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;box-shadow:-16px 0 40px rgba(0,0,0,.4);}
.drawer.show{right:0;}
.drawer-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.drawer-head h3{margin:0;font-size:17px;font-weight:800;}
.drawer-close{background:var(--surface-2);border:none;color:var(--ink-2);width:32px;height:32px;border-radius:9px;cursor:pointer;}
.drawer-body{padding:22px 24px;overflow-y:auto;flex:1;}
.drawer-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;}

/* ---------- small confirm modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:70;}
.modal-bg.show{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:16px;padding:22px;width:420px;max-width:92vw;}

.row-line{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px;}
.row-line select,.row-line input{margin-bottom:0;}
.chip-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.chip{background:var(--surface-2);border:1px solid var(--border);padding:6px 10px 6px 12px;border-radius:20px;
  font-size:12.5px;display:flex;align-items:center;gap:8px;}
.chip button{background:none;border:none;color:var(--ink-muted);cursor:pointer;font-size:14px;line-height:1;padding:0;}
.chip button:hover{color:var(--critical);}

/* ---------- toast ---------- */
.toast-stack{position:fixed;top:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--surface-2);border:1px solid var(--border-strong);padding:13px 16px;border-radius:11px;
  min-width:260px;box-shadow:var(--shadow);display:flex;align-items:flex-start;gap:10px;
  animation:slideIn .2s ease;}
@keyframes slideIn{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.toast .ic{width:20px;height:20px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.toast.ok .ic{background:rgba(12,163,12,.2);color:var(--good);}
.toast.err .ic{background:rgba(208,59,59,.2);color:var(--critical);}
.toast .msg{font-size:13px;}

.muted{color:var(--ink-muted);}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.empty-state{padding:44px 20px;text-align:center;color:var(--ink-muted);}
.empty-state svg{width:38px;height:38px;margin-bottom:10px;opacity:.5;}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%);
  background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:8px;}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:-100% 0;}}
.skel-row{height:36px;margin-bottom:8px;}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px;}

/* ---------- KANBAN (Work Order) ---------- */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;}
.kanban-col{flex:0 0 250px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;display:flex;flex-direction:column;min-height:120px;transition:.15s;}
.kanban-col.dragover{background:rgba(57,135,229,.1);border-color:var(--brand);}
.kanban-col h4{margin:0 0 10px;font-size:12.5px;display:flex;align-items:center;gap:7px;color:var(--ink-2);}
.kanban-col h4 .count{margin-left:auto;background:var(--surface-3);padding:1px 8px;border-radius:10px;font-size:11px;}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px;margin-bottom:9px;
  cursor:grab;transition:.15s;}
.kcard:hover{border-color:var(--border-strong);transform:translateY(-1px);}
.kcard:active{cursor:grabbing;}
.kcard.dragging{opacity:.4;}
.kcard .woid{font-size:11.5px;font-weight:700;color:var(--brand);}
.kcard .cust{font-size:13px;font-weight:600;margin:4px 0 2px;}
.kcard .plate{font-size:11.5px;color:var(--ink-muted);}
.kcard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;}
.kcard .total{font-size:12px;font-weight:700;}

/* ---------- stepper (progress WO / PO) ---------- */
.stepper{display:flex;align-items:center;margin:14px 0 20px;}
.step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;}
.step .circle{width:26px;height:26px;border-radius:50%;background:var(--surface-3);border:2px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--ink-muted);z-index:2;}
.step.done .circle{background:var(--good);border-color:var(--good);color:#fff;}
.step.current .circle{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 0 0 4px rgba(57,135,229,.25);}
.step .stitle{font-size:10px;color:var(--ink-muted);margin-top:6px;text-align:center;max-width:80px;}
.step.done .stitle,.step.current .stitle{color:var(--ink);}
.step:not(:last-child)::after{content:'';position:absolute;top:13px;left:calc(50% + 16px);right:calc(-50% + 16px);
  height:2px;background:var(--border-strong);z-index:1;}
.step.done:not(:last-child)::after{background:var(--good);}

/* ---------- chart helpers ---------- */
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--ink-2);}
.chart-legend .item{display:flex;align-items:center;gap:6px;}
.chart-legend .sw{width:9px;height:9px;border-radius:2px;}
.tooltip-svg{position:fixed;background:#0b0b0b;border:1px solid var(--border-strong);border-radius:8px;padding:7px 10px;
  font-size:11.5px;pointer-events:none;z-index:200;box-shadow:var(--shadow);display:none;white-space:nowrap;}

.view-toggle{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;}
.view-toggle button{background:none;border:none;color:var(--ink-muted);padding:6px 12px;border-radius:7px;font-size:12px;
  font-weight:700;cursor:pointer;}
.view-toggle button.active{background:var(--surface-3);color:var(--ink);}

.activity-item{display:flex;gap:11px;padding:10px 0;border-bottom:1px dashed var(--border);}
.activity-item:last-child{border-bottom:none;}
.activity-item .aic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.activity-item .aic svg{width:14px;height:14px;}
.activity-item .txt{font-size:12.5px;}
.activity-item .time{font-size:10.5px;color:var(--ink-muted);margin-top:2px;}

@media(max-width:820px){
  .sidebar{position:fixed;left:-260px;z-index:80;transition:left .2s;} .sidebar.mobile-open{left:0;}
  .main{width:100%;}
}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">DMS</div>
      <div class="brand-text"><h1>DMS Integrasi</h1><span>Prima Wuling Aftersales</span></div>
      <button class="collapse-btn" onclick="toggleSidebar()" title="Collapse">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>
    <div class="nav-group" id="navGroup"></div>
  </div>

  <div class="main">
    <div class="topbar">
      <button class="collapse-btn" style="display:none" id="mobileToggle" onclick="document.getElementById('sidebar').classList.toggle('mobile-open')">☰</button>
      <div><div class="crumb" id="crumb">DMS</div><h2 id="pageTitle">Dashboard</h2></div>
      <div class="searchbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="globalSearch" placeholder="Cari part, WO, PO...">
      </div>
      <div class="bell" onclick="views.dashboard()" title="Peringatan stok"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg><span class="dot" id="bellDot" style="display:none"></span></div>
      <div class="avatar">AF</div>
    </div>
    <div class="content" id="main"><div class="skeleton skel-row" style="width:200px"></div></div>
  </div>
</div>

<div class="drawer-bg" id="drawerBg"><div class="drawer" id="drawer"></div></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBody"></div></div>
<div class="toast-stack" id="toastStack"></div>
<div class="tooltip-svg" id="svgTooltip"></div>

<script>
/* ================= KONFIGURASI ================= */
const API_URL = 'https://script.google.com/macros/s/AKfycbyh6YpbGab0HqPqZVaG9xNet320OLZgDbWUXxO8DfKkYfKN4y23dr3aZZPpOwyMDVCIVQ/exec'; // ganti dengan URL /exec hasil deploy

/* ================= ICONS ================= */
const ICONS = {
  dashboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
  customer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>',
  vehicle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 13l1.5-5A2 2 0 016.4 6.5h11.2A2 2 0 0119.5 8l1.5 5"/><rect x="2" y="13" width="20" height="6" rx="1.5"/><circle cx="7" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/></svg>',

/* ================= SIMPLE TABLE COMPONENT (search + sort) ================= */
function dataTable(opts){
  // opts: {id, columns:[{key,label,render,sortable,numeric}], rows, searchKeys, rowActions}
  const state = { sortKey:null, sortDir:1, q:'' };
  const wrapId = 'tbl_'+opts.id;
  function matches(row){
    if(!state.q) return true;
    const q = state.q.toLowerCase();
    return (opts.searchKeys||opts.columns.map(c=>c.key)).some(k=>String(row[k]||'').toLowerCase().includes(q));
  }
  function sortRows(rows){
    if(!state.sortKey) return rows;
    const k = state.sortKey;
    return [...rows].sort((a,b)=>{
      let va=a[k], vb=b[k];
      if(!isNaN(va) && !isNaN(vb) && va!=='' && vb!==''){ va=Number(va); vb=Number(vb); }
      if(va<vb) return -1*state.sortDir; if(va>vb) return 1*state.sortDir; return 0;
    });
  }
  function render(){
    const filtered = sortRows(opts.rows.filter(matches));
    const el = document.getElementById(wrapId);
    if(!el) return;
    el.innerHTML = `
      <div class="flex-between" style="margin-bottom:12px;">
        <div class="searchbox" style="width:230px;margin-left:0;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input placeholder="Cari..." value="${esc(state.q)}" oninput="window.__tbl_${opts.id}.search(this.value)">
        </div>
        <span class="muted" style="font-size:12px;">${filtered.length} data</span>
      </div>
      <div style="overflow-x:auto;">
      <table><thead><tr>
        ${opts.columns.map(c=>`<th ${c.sortable!==false?`onclick="window.__tbl_${opts.id}.sort('${c.key}')"`:''}>${c.label}${state.sortKey===c.key?`<span class="sort-arrow">${state.sortDir>0?'▲':'▼'}</span>`:''}</th>`).join('')}
        ${opts.rowActions?'<th></th>':''}
      </tr></thead><tbody>
      ${filtered.length===0 ? `<tr><td colspan="${opts.columns.length+1}">${emptyState('Tidak ada data')}</td></tr>` :
        filtered.map(row=>`<tr>${opts.columns.map(c=>`<td class="${c.numeric?'num':''}">${c.render?c.render(row):esc(row[c.key])}</td>`).join('')}${opts.rowActions?`<td>${opts.rowActions(row)}</td>`:''}</tr>`).join('')}
      </tbody></table>
      </div>
    `;
  }
  window['__tbl_'+opts.id] = {
    search(q){ state.q = q; render(); },
    sort(k){ if(state.sortKey===k) state.sortDir*=-1; else {state.sortKey=k; state.sortDir=1;} render(); },
    refresh(rows){ if(rows) opts.rows = rows; render(); }
  };
  return `<div id="${wrapId}"></div>`;
}
function initTable(id){ window['__tbl_'+id].search(''); }

// Horizontal bar chart - identity/kategori, label langsung di ujung bar.
// Semua koordinat/angka diisi lewat DOM API setelah SVG dipasang ke halaman (bukan lewat teks HTML),
// supaya kebal dari gangguan tanda kutip di jaringan/browser tertentu.
function hBarChart(items, opts={}){
  const max = Math.max(1, ...items.map(i=>i.value));
  const barH = 20, gap = 14;
  const chartW = 560, leftPad = 130, rightPad = 60;
  const plotW = chartW - leftPad - rightPad;
  const h = items.length * (barH+gap);
  let inner = '';
  items.forEach(function(it){
    inner += '<text class="hbar-label" text-anchor="end" font-size="11.5" fill="var(--ink-2)"></text>';
    inner += '<rect class="hbar-track" rx="4" fill="var(--surface-3)" opacity=".35"></rect>';
    inner += '<rect class="hbar" fill="var(--s1)" style="cursor:pointer;"></rect>';
    inner += '<text class="hbar-value" font-size="11.5" font-weight="700" fill="var(--ink)"></text>';
  });
  const svg = '<svg class="hbar-svg" preserveAspectRatio="xMinYMin meet" style="overflow:visible;" width="100%">' + inner + '</svg>';
  return { svg: svg, items: items, layout: {chartW:chartW, h:h, leftPad:leftPad, barH:barH, gap:gap, plotW:plotW, max:max} };
}
function attachHBarChart(containerEl, chart){
  const svgEl = containerEl.querySelector('.hbar-svg');
  if(!svgEl) return;
  const L = chart.layout;
  svgEl.setAttribute('viewBox', '0 0 ' + L.chartW + ' ' + (L.h+10));
  svgEl.style.maxWidth = L.chartW + 'px';
  const labels = svgEl.querySelectorAll('.hbar-label');
  const tracks = svgEl.querySelectorAll('.hbar-track');
  const bars = svgEl.querySelectorAll('.hbar');
  const values = svgEl.querySelectorAll('.hbar-value');
  chart.items.forEach(function(it,i){
    const y = i*(L.barH+L.gap);
    const bw = Math.max(2, (it.value/L.max)*L.plotW);
    labels[i].setAttribute('x', L.leftPad-10); labels[i].setAttribute('y', y+L.barH/2+4); labels[i].textContent = it.label;
    tracks[i].setAttribute('x', L.leftPad); tracks[i].setAttribute('y', y); tracks[i].setAttribute('width', L.plotW); tracks[i].setAttribute('height', L.barH);
    bars[i].setAttribute('x', L.leftPad); bars[i].setAttribute('y', y); bars[i].setAttribute('width', bw); bars[i].setAttribute('height', L.barH);
    bars[i].style.fill = 'var(--' + (it.colorVar||'s1') + ')';
    values[i].setAttribute('x', L.leftPad+bw+8); values[i].setAttribute('y', y+L.barH/2+4); values[i].textContent = it.value;
  });
}

// Line/area chart - trend waktu (satu seri, hue sequential biru). Sama seperti di atas: koordinat
// diisi lewat DOM API setelah dipasang ke halaman.
function lineChart(labels, values, opts={}){
  const chartW = 560, chartH = 200, padL = 50, padR = 16, padT = 16, padB = 30;
  const plotW = chartW-padL-padR, plotH = chartH-padT-padB;
  const max = Math.max(...values, 1);
  const min = Math.min(...values, 0);
  const range = (max-min)||1;
  const pts = values.map((v,i)=>({
    x: padL + (i/(values.length-1||1))*plotW,
    y: padT + plotH - ((v-min)/range)*plotH,
    v, label: labels[i]
  }));
  let gridLines = '';
  for(let k=0;k<5;k++){ gridLines += '<line class="grid-line" data-k="'+k+'"></line>'; }
  let dots = '', labelTexts = '';
  pts.forEach(function(){ dots += '<circle class="linept" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" style="cursor:pointer;"></circle>'; });
  pts.forEach(function(){ labelTexts += '<text class="line-label" text-anchor="middle" font-size="10" fill="var(--ink-muted)"></text>'; });
  const svg = '<svg class="line-svg" style="overflow:visible;" width="100%">' +
    '<defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="var(--s1)" stop-opacity=".22"></stop>' +
      '<stop offset="100%" stop-color="var(--s1)" stop-opacity="0"></stop>' +
    '</linearGradient></defs>' +
    gridLines +
    '<path class="area-path" fill="url(#areaFill)"></path>' +
    '<path class="line-path" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>' +
    dots + labelTexts +
    '<text class="line-endlabel" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)"></text>' +
  '</svg>';
  return {svg: svg, pts: pts, fmt: opts.fmt, layout:{chartW:chartW, chartH:chartH, padL:padL, padR:padR, padT:padT, plotH:plotH}};
}
function attachLineChart(containerEl, chart){
  const svgEl = containerEl.querySelector('.line-svg');
  if(!svgEl) return;
  const L = chart.layout, pts = chart.pts;
  svgEl.setAttribute('viewBox', '0 0 ' + L.chartW + ' ' + L.chartH);
  svgEl.style.maxWidth = L.chartW + 'px';
  svgEl.querySelectorAll('.grid-line').forEach(function(el,k){
    const f = k*0.25, y = L.padT + L.plotH*f;
    el.setAttribute('x1', L.padL); el.setAttribute('y1', y); el.setAttribute('x2', L.chartW-L.padR); el.setAttribute('y2', y);
    el.setAttribute('stroke', 'var(--border)'); el.setAttribute('stroke-width', 1);
  });
  const path = pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  const areaPath = path + ' L' + pts[pts.length-1].x.toFixed(1) + ' ' + (L.padT+L.plotH) + ' L' + pts[0].x.toFixed(1) + ' ' + (L.padT+L.plotH) + ' Z';
  svgEl.querySelector('.area-path').setAttribute('d', areaPath);
  svgEl.querySelector('.line-path').setAttribute('d', path);
  svgEl.querySelectorAll('.linept').forEach(function(el,i){ el.setAttribute('cx', pts[i].x.toFixed(1)); el.setAttribute('cy', pts[i].y.toFixed(1)); });
  svgEl.querySelectorAll('.line-label').forEach(function(el,i){ el.setAttribute('x', pts[i].x.toFixed(1)); el.setAttribute('y', L.chartH-8); el.textContent = pts[i].label; });
  const endEl = svgEl.querySelector('.line-endlabel');
  const lastPt = pts[pts.length-1];
  endEl.setAttribute('x', lastPt.x.toFixed(1)); endEl.setAttribute('y', (lastPt.y-12).toFixed(1));
  endEl.textContent = chart.fmt ? chart.fmt(lastPt.v) : lastPt.v;
}

// Donut chart - proporsi (mis. status PO). Koordinat & angka DIISI lewat DOM API setelah dipasang ke halaman
// (bukan dituliskan sebagai teks di dalam string HTML), supaya kebal dari gangguan tanda kutip di jaringan/browser.
function donutChart(items, opts={}){
  const size = opts.size||160, r=size/2-14, cx=size/2, cy=size/2, sw=20;
  const total = items.reduce((s,i)=>s+i.value,0)||1;
  let acc = -90;
  const circ = 2*Math.PI*r;
  const parts = [];
  parts.push('<svg class="donut-svg">');
  items.forEach((it,i)=>{
    parts.push('<circle class="donut-seg" data-i="'+i+'" fill="none" stroke="var(--'+it.colorVar+')" style="cursor:pointer;transition:.2s;"/>');
  });
  parts.push('<text class="donut-total-num" text-anchor="middle" font-size="20" font-weight="800" fill="var(--ink)"></text>');
  parts.push('<text class="donut-total-lbl" text-anchor="middle" font-size="10" fill="var(--ink-muted)">Total</text>');
  parts.push('</svg>');
  return { svg: parts.join(''), size, r, cx, cy, sw, circ, total, items };
}
function attachDonutChart(containerEl, chart){
  const svgEl = containerEl.querySelector('.donut-svg');
  if(!svgEl) return;
  svgEl.setAttribute('width', chart.size);
  svgEl.setAttribute('height', chart.size);
  svgEl.setAttribute('viewBox', '0 0 ' + chart.size + ' ' + chart.size);
  let acc = -90;
  const segs = svgEl.querySelectorAll('.donut-seg');
  chart.items.forEach((it,i)=>{
    const el = segs[i];
    const frac = it.value/chart.total;
    const dash = chart.circ*frac;
    el.setAttribute('cx', chart.cx); el.setAttribute('cy', chart.cy); el.setAttribute('r', chart.r);
    el.setAttribute('stroke-width', chart.sw);
    el.setAttribute('stroke-dasharray', (dash-2)+' '+(chart.circ-dash+2));
    el.setAttribute('stroke-dashoffset', (-acc/360*chart.circ));
    el.setAttribute('transform', 'rotate(-90 '+chart.cx+' '+chart.cy+')');
    acc += frac*360;
  });
  const numEl = svgEl.querySelector('.donut-total-num');
  numEl.setAttribute('x', chart.cx); numEl.setAttribute('y', chart.cy-2); numEl.textContent = chart.total;
  const lblEl = svgEl.querySelector('.donut-total-lbl');
  lblEl.setAttribute('x', chart.cx); lblEl.setAttribute('y', chart.cy+16);
}

let woCart = { parts:[], labors:[] };
let woViewMode = 'kanban';
const WO_FLOW = ['New','Dispatching','Material Picking','Completed','Invoice','Vehicle Delivery'];

async function renderWorkOrder(){
  setMain(skeletonRows(4));
  const res = await apiGet('listWorkOrder');
  window.__woData = (res.data||[]).sort((a,b)=> new Date(b.CreatedAt)-new Date(a.CreatedAt));
  drawWorkOrderView();
}
function drawWorkOrderView(){
  const data = window.__woData || [];
  setMain(`
    <div class="page-head">
      <div><h2>Work Order</h2><p>General Repair / Body Repair — ${data.length} WO aktif</p></div>
      <div style="display:flex;gap:10px;">
        <div class="view-toggle">
          <button class="${woViewMode==='kanban'?'active':''}" onclick="woViewMode='kanban';drawWorkOrderView()">Board</button>
          <button class="${woViewMode==='list'?'active':''}" onclick="woViewMode='list';drawWorkOrderView()">List</button>
        </div>
        <button class="btn" onclick="formWorkOrder()">${icon('plus')} Buat Work Order</button>
      </div>
    </div>
    <div id="woBody"></div>
  `);
  if(woViewMode==='kanban') drawKanban(data); else drawWOList(data);
}
function drawKanban(data){
  const el = document.getElementById('woBody');
  el.innerHTML = `<div class="kanban">${WO_FLOW.map(status=>{
    const items = data.filter(w=>w.Status===status);
    return `<div class="kanban-col" data-status="${status}">
      <h4><span class="badge ${WO_STATUS_SLOT[status]}"><span class="dot"></span></span>${status}<span class="count">${items.length}</span></h4>
      <div class="kcards" data-status="${status}">
        ${items.map(w=>`
          <div class="kcard" draggable="true" data-woid="${w.WOID}" onclick="viewWorkOrder('${w.WOID}')">
            <div class="woid">${w.WOID}</div>
            <div class="cust">${esc(w.NamaCustomer)}</div>
            <div class="plate">${esc(w.NoPolisi)} · ${esc(w.JenisWO)}</div>
            <div class="foot"><span class="total">${fmtMoney(w.TotalWO)}</span></div>
          </div>`).join('')}
      </div>
    </div>`;
  }).join('')}</div>`;

  // drag & drop
  el.querySelectorAll('.kcard').forEach(card=>{
    card.addEventListener('dragstart', e=>{ card.classList.add('dragging'); e.dataTransfer.setData('text/plain', card.dataset.woid); });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
  });
  el.querySelectorAll('.kanban-col').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('dragover'));
    col.addEventListener('drop', async e=>{
      e.preventDefault(); col.classList.remove('dragover');
      const woid = e.dataTransfer.getData('text/plain');
      const newStatus = col.dataset.status;
      const wo = (window.__woData||[]).find(w=>w.WOID===woid);
      if(!wo || wo.Status===newStatus) return;
      const curIdx = WO_FLOW.indexOf(wo.Status), newIdx = WO_FLOW.indexOf(newStatus);
      if(newIdx < curIdx){ toast('Tidak bisa mundur status WO', true); return; }
      const res = await apiPost('updateWorkOrderStatus', {WOID:woid, Status:newStatus});
      if(res.success){ toast(`${woid} -> ${newStatus}`); renderWorkOrder(); } else toast(res.message, true);
    });
  });
}

  document.getElementById('woBody').innerHTML = `<div class="panel">${dataTable({
    id:'wo', rows:data, searchKeys:['WOID','NamaCustomer','NoPolisi'],
    columns:[

  })}</div>`;
  initTable('wo');
}

  document.getElementById('ks_result').innerHTML = `
    <div class="cards">
      <div class="stat-card"><div class="label">Stok Akhir</div><div class="value">${part.StokAkhir}</div></div>
      <div class="stat-card"><div class="label">Stok Minimum</div><div class="value">${part.StokMinimum}</div></div>
      <div class="stat-card"><div class="label">Lokasi</div><div class="value" style="font-size:16px;">${esc(part.Lokasi)||'-'}</div></div>
    </div>
    ${trendVals.length>1 ? `<div class="panel"><h3>Tren Stok (mutasi terakhir)</h3><div id="ks_line"></div></div>` : ''}
    <div class="panel">
      ${history.length===0 ? emptyState('Belum ada mutasi.') : `<table><tr><th>Tgl</th><th>Tipe</th><th>Qty</th><th>Sumber</th><th>Reference</th><th>Stok Sebelum</th><th>Stok Sesudah</th></tr>
      ${history.slice().reverse().map(h=>`<tr><td>${fmtDate(h.Tgl)}</td><td><span class="badge ${h.Tipe==='Inbound'?'good':'critical'}"><span class="dot"></span>${h.Tipe}</span></td><td class="num">${h.Qty}</td><td>${esc(h.Sumber)}</td><td>${esc(h.Reference)}</td><td class="num">${h.StokSebelum}</td><td class="num">${h.StokSesudah}</td></tr>`).join('')}
      </table>`}
    </div>
  `;
  if(trendVals.length>1){
    const lc = lineChart(trendLabels, trendVals);
    const ksLine = document.getElementById('ks_line');
    ksLine.innerHTML = lc.svg;
    attachLineChart(ksLine, lc);
    attachLineTooltip(ksLine, lc.pts);
  }
}

/* ================= GLOBAL SEARCH (shortcut ke Kartu Stok / WO / PO) ================= */
document.getElementById('globalSearch').addEventListener('keydown', async e=>{
  if(e.key!=='Enter') return;
  const q = e.target.value.trim();
  if(!q) return;
  toast('Mencari "'+q+'"...');
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  document.querySelector('[data-view="partmaster"]').classList.add('active');
  document.getElementById('pageTitle').textContent = 'Part Master';
  await renderPartMaster();
  if(window.__tbl_part) window.__tbl_part.search(q);
});

/* ================= INIT ================= */
renderDashboard();
</script>
</body>
</html>
