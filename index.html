<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DMS Integrasi — BW Auto Craft</title>
<style>
/* ============ DESIGN TOKENS (dark theme, palet kategorikal & status tervalidasi) ============ */
:root{
  /* ---- tema terang/modern: layar utama abu-abu, kartu putih ---- */
  --page:#eef1f6; --surface:#ffffff; --surface-2:#f2f4f8; --surface-3:#e6e9f0;
  --border:rgba(20,30,55,.09); --border-strong:rgba(20,30,55,.16);
  --ink:#171d2b; --ink-2:#454f66; --ink-muted:#848da3;
  --brand:#2f6fd6; --brand-2:#7c6fe0;
  /* kategorikal (urutan tetap, jangan diacak) */
  --s1:#2f6fd6; --s2:#c2531d; --s3:#128a63; --s4:#a8730a; --s5:#c2456f; --s6:#0a8f0a; --s7:#7c6fe0; --s8:#d65454;
  /* status (dicadangkan, tidak dipakai utk kategori lain) */
  --good:#0a8f0a; --warn:#c98a00; --serious:#d3673f; --critical:#c23a3a;
  --radius:14px; --radius-sm:9px;
  --shadow:0 10px 30px rgba(20,30,55,.10);
  /* ---- sidebar: biru navy, font putih (terpisah dari tema layar utama di atas) ---- */
  --sb-bg:linear-gradient(180deg,#0d2a52,#0a1f3d); --sb-border:rgba(255,255,255,.09);
  --sb-ink:#eaf1fc; --sb-ink-muted:#93a9cc; --sb-hover:rgba(255,255,255,.09);
  --sb-active-bg:linear-gradient(135deg,rgba(79,150,240,.38),rgba(140,127,235,.30));
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:
  radial-gradient(1200px 600px at 90% -10%, rgba(47,111,214,.07), transparent),
  radial-gradient(900px 500px at -10% 110%, rgba(124,111,224,.06), transparent),
  var(--page);color:var(--ink);min-height:100vh;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:10px;}
::-webkit-scrollbar-track{background:transparent;}

.app{display:flex;min-height:100vh;}

/* ---------- SIDEBAR ---------- */
.sidebar{width:242px;flex-shrink:0;background:var(--sb-bg);backdrop-filter:blur(10px);
  border-right:1px solid var(--sb-border);position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;transition:width .2s ease;}
.sidebar.collapsed{width:72px;}
.sidebar.collapsed .label,.sidebar.collapsed .nav-title,.sidebar.collapsed .brand-text,.sidebar.collapsed .sidebar-footer .label{display:none;}
.sidebar-scroll{flex:1;min-height:0;overflow-y:auto;padding:18px 12px;}
.sidebar-footer{flex-shrink:0;padding:10px 12px 16px;border-top:1px solid var(--sb-border);}
.sidebar-footer .nav-item{color:var(--sb-ink-muted);}
.sidebar-footer .nav-item:hover{background:var(--sb-hover);color:var(--sb-ink);}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px;padding:4px 6px;}
.brand .logo{width:38px;height:38px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,var(--brand),var(--brand-2));display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.35);overflow:hidden;color:#fff;}
.brand .logo.has-img{background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.2);}
.brand .logo img{width:100%;height:100%;object-fit:contain;}
.brand-text h1{font-size:14px;margin:0;line-height:1.2;font-weight:700;color:var(--sb-ink);}
.brand-text span{display:block;font-size:10.5px;color:var(--sb-ink-muted);margin-top:1px;}
.collapse-btn{margin-left:auto;background:none;border:none;color:var(--sb-ink-muted);cursor:pointer;padding:4px;
  border-radius:6px;display:flex;}
.collapse-btn:hover{background:var(--sb-hover);color:var(--sb-ink);}
.nav-title{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--sb-ink-muted);
  margin:16px 10px 6px;font-weight:700;display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;padding:2px 2px;border-radius:6px;user-select:none;}
.nav-title:hover{color:var(--sb-ink);}
.nav-arrow{flex-shrink:0;transition:transform .15s;}
.nav-title.collapsed .nav-arrow{transform:rotate(-90deg);}
.nav-items{overflow:hidden;}
.nav-items.collapsed{display:none;}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;cursor:pointer;
  color:var(--sb-ink-muted);font-size:13.5px;transition:.15s;position:relative;margin-bottom:2px;white-space:nowrap;}
.nav-item svg{flex-shrink:0;width:18px;height:18px;}
.nav-item:hover{background:var(--sb-hover);color:var(--sb-ink);}
.nav-item.active{background:var(--sb-active-bg);color:#fff;font-weight:600;}
.nav-item.active::before{content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;
  background:linear-gradient(180deg,var(--brand),var(--brand-2));}
.nav-badge{margin-left:auto;background:var(--critical);color:#fff;font-size:10px;font-weight:800;
  padding:1px 6px;border-radius:20px;}

/* ---------- MAIN ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{display:flex;align-items:center;gap:16px;padding:14px 26px;border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.72);backdrop-filter:blur(8px);position:sticky;top:0;z-index:20;}
.topbar .crumb{font-size:12px;color:var(--ink-muted);}
.topbar h2{margin:0;font-size:18px;font-weight:700;}
.searchbox{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:10px;padding:7px 12px;width:260px;}
.searchbox input{background:none;border:none;outline:none;color:var(--ink);font-size:13px;width:100%;}
.searchbox svg{width:15px;height:15px;color:var(--ink-muted);flex-shrink:0;}
.bell{position:relative;width:34px;height:34px;border-radius:10px;background:var(--surface-2);
  border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--ink-2);cursor:pointer;}
.bell .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--critical);
  box-shadow:0 0 0 2px var(--surface);}
.avatar{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--s7),var(--s5));
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;}
.content{padding:22px 26px 40px;overflow-y:auto;}

/* ---------- COMMON ---------- */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;gap:12px;flex-wrap:wrap;}
.page-head h2{margin:0;font-size:21px;font-weight:800;}
.page-head p{margin:4px 0 0;color:var(--ink-muted);font-size:13px;}
.btn{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;border:none;padding:10px 16px;
  border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;transition:.15s;display:inline-flex;align-items:center;gap:7px;}
.btn svg{width:15px;height:15px;}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn.secondary{background:#dde1e8;border:1px solid var(--border-strong);color:var(--ink);}
.btn.secondary:hover{background:#cfd4dd;}
.btn.good{background:linear-gradient(135deg,#0ca30c,#0a8a0a);}
.btn.accent{background:linear-gradient(135deg,#0a8f0a,#0c7a3f);color:#fff;}
.btn.outline{background:var(--surface);border:1.5px solid var(--brand);color:var(--brand);}
.btn.outline:hover{background:rgba(47,111,214,.08);}
.btn.critical{background:linear-gradient(135deg,#d03b3b,#a92e2e);}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:8px;}
.btn.ghost{background:var(--surface-3);border:1px solid var(--border-strong);color:var(--ink-2);}
.btn.ghost:hover{background:var(--border-strong);color:var(--ink);}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:20px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px 18px;
  position:relative;overflow:hidden;}
.stat-card .icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.stat-card .icon svg{width:17px;height:17px;}
.stat-card .label{font-size:12px;color:var(--ink-muted);font-weight:600;}
.stat-card .value{font-size:25px;font-weight:800;margin-top:3px;}
.stat-card .delta{font-size:11.5px;margin-top:4px;font-weight:700;display:flex;align-items:center;gap:4px;}
.delta.up{color:var(--good);} .delta.down{color:var(--critical);} .delta.flat{color:var(--ink-muted);}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:19px;
  margin-bottom:18px;box-shadow:var(--shadow);}
.panel h3{margin:0 0 4px;font-size:14.5px;font-weight:700;}
.panel .sub{font-size:11.5px;color:var(--ink-muted);margin:0 0 14px;}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:1000px){.grid2{grid-template-columns:1fr;}}

table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:10px 10px;text-align:left;border-bottom:1px solid var(--border);}
th{background:var(--surface-3);color:var(--ink-2);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  cursor:pointer;user-select:none;white-space:nowrap;}
th:first-child{border-top-left-radius:8px;} th:last-child{border-top-right-radius:8px;}
th:hover{color:var(--ink);background:var(--border-strong);}
th .sort-arrow{font-size:9px;margin-left:3px;opacity:.6;}
tbody tr{transition:.1s;}
tbody tr:hover td{background:rgba(20,30,55,.035);}
td.num{font-variant-numeric:tabular-nums;}

.badge{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.badge .dot{width:6px;height:6px;border-radius:50%;}
.badge.s1{background:rgba(47,111,214,.13);color:#1d5bb0;} .badge.s1 .dot{background:var(--s1);}
.badge.s2{background:rgba(194,83,29,.13);color:#a3441a;} .badge.s2 .dot{background:var(--s2);}
.badge.s3{background:rgba(18,138,99,.13);color:#0f7a56;} .badge.s3 .dot{background:var(--s3);}
.badge.s4{background:rgba(168,115,10,.16);color:#8a5f00;} .badge.s4 .dot{background:var(--s4);}
.badge.s5{background:rgba(194,69,111,.13);color:#a13a63;} .badge.s5 .dot{background:var(--s5);}
.badge.s6{background:rgba(10,143,10,.13);color:#0a7a0a;} .badge.s6 .dot{background:var(--s6);}
.badge.s7{background:rgba(124,111,224,.16);color:#5b4fc7;} .badge.s7 .dot{background:var(--s7);}
.badge.good{background:rgba(10,143,10,.13);color:#0a7a0a;} .badge.good .dot{background:var(--good);}
.badge.warn{background:rgba(201,138,0,.16);color:#8a5f00;} .badge.warn .dot{background:var(--warn);}
.badge.critical{background:rgba(194,58,58,.14);color:#a13030;} .badge.critical .dot{background:var(--critical);}
.badge.muted{background:var(--surface-3);color:var(--ink-muted);} .badge.muted .dot{background:var(--ink-muted);}

.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:2px;}
.tab{padding:9px 15px;cursor:pointer;font-size:13px;color:var(--ink-muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--ink);border-color:var(--brand);}

label{font-size:12px;color:var(--ink-muted);display:block;margin-bottom:5px;font-weight:600;}
input,select,textarea{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--border-strong);
  background:var(--surface-2);color:var(--ink);font-size:13px;margin-bottom:13px;font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);}
textarea{resize:vertical;min-height:60px;}

/* ---------- DRAWER (slide-in panel, ganti modal utk form) ---------- */
.drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:60;}
.drawer-bg.show{display:block;}
.drawer{position:fixed;top:0;right:-720px;width:680px;max-width:94vw;height:100vh;background:var(--surface);
  border-left:1px solid var(--border-strong);z-index:61;transition:right .25s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;box-shadow:-16px 0 40px rgba(0,0,0,.4);}
.drawer.show{right:0;}
.drawer.wide{width:1180px;right:-1180px;}
.drawer.wide.show{right:0;}
.drawer-body.wide-body{padding:0;overflow:hidden;display:flex;}
.wo-grid{display:flex;flex:1;min-height:0;}
.wo-grid .wo-col{flex:1;padding:22px 24px;overflow-y:auto;}
.wo-grid .wo-col-right{max-width:360px;border-left:1px solid var(--border);background:var(--surface-2);}
.wo-items-section{position:relative;}
.wo-items-section.locked{opacity:.4;pointer-events:none;filter:grayscale(.3);}
.wo-lock-hint{background:rgba(201,138,0,.12);border:1px solid rgba(201,138,0,.35);color:#8a5f00;
  padding:10px 14px;border-radius:10px;font-size:12.5px;margin-bottom:14px;}
.item-disc-input{width:60px;}
.disc-ratio-bar{height:6px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin:8px 0;}
.disc-ratio-bar > div{height:100%;background:var(--brand);transition:width .2s;}
.disc-ratio-bar.over > div{background:#d03b3b;}
.drawer-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.drawer-head h3{margin:0;font-size:17px;font-weight:800;}
.drawer-close{background:var(--surface-2);border:none;color:var(--ink-2);width:32px;height:32px;border-radius:9px;cursor:pointer;}
.drawer-body{padding:22px 24px;overflow-y:auto;flex:1;}
.drawer-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;}

/* ---------- small confirm modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:70;}
.modal-bg.show{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border-strong);border-radius:16px;padding:22px;width:420px;max-width:92vw;}

.row-line{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px;}
.row-line select,.row-line input{margin-bottom:0;}
.chip-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.chip{background:var(--surface-2);border:1px solid var(--border);padding:6px 10px 6px 12px;border-radius:20px;
  font-size:12.5px;display:flex;align-items:center;gap:8px;}
.chip button{background:none;border:none;color:var(--ink-muted);cursor:pointer;font-size:14px;line-height:1;padding:0;}
.chip button:hover{color:var(--critical);}

/* ---------- toast ---------- */
.toast-stack{position:fixed;top:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:10px;}
.toast{background:var(--surface-2);border:1px solid var(--border-strong);padding:13px 16px;border-radius:11px;
  min-width:260px;box-shadow:var(--shadow);display:flex;align-items:flex-start;gap:10px;
  animation:slideIn .2s ease;}
@keyframes slideIn{from{transform:translateX(30px);opacity:0;}to{transform:translateX(0);opacity:1;}}
.toast .ic{width:20px;height:20px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:1px;}
.toast.ok .ic{background:rgba(12,163,12,.2);color:var(--good);}
.toast.err .ic{background:rgba(208,59,59,.2);color:var(--critical);}
.toast .msg{font-size:13px;}

.muted{color:var(--ink-muted);}
.flex-between{display:flex;justify-content:space-between;align-items:center;}
.empty-state{padding:44px 20px;text-align:center;color:var(--ink-muted);}
.empty-state svg{width:38px;height:38px;margin-bottom:10px;opacity:.5;}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%);
  background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:8px;}
@keyframes shimmer{0%{background-position:100% 0;}100%{background-position:-100% 0;}}
.skel-row{height:36px;margin-bottom:8px;}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--border);font-size:13px;}

/* ---------- KANBAN (Work Order) ---------- */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;}
.kanban-col{flex:0 0 250px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px;display:flex;flex-direction:column;min-height:120px;transition:.15s;}
.kanban-col.dragover{background:rgba(57,135,229,.1);border-color:var(--brand);}
.kanban-col h4{margin:0 0 10px;font-size:12.5px;display:flex;align-items:center;gap:7px;color:var(--ink-2);}
.kanban-col h4 .count{margin-left:auto;background:var(--surface-3);padding:1px 8px;border-radius:10px;font-size:11px;}
.kcard{background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px;margin-bottom:9px;
  cursor:grab;transition:.15s;}
.kcard:hover{border-color:var(--border-strong);transform:translateY(-1px);}
.kcard:active{cursor:grabbing;}
.kcard.dragging{opacity:.4;}
.kcard .woid{font-size:11.5px;font-weight:700;color:var(--brand);}
.kcard .cust{font-size:13px;font-weight:600;margin:4px 0 2px;}
.kcard .plate{font-size:11.5px;color:var(--ink-muted);}
.kcard .foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;}
.kcard .total{font-size:12px;font-weight:700;}

/* ---------- stepper (progress WO / PO) ---------- */
.stepper{display:flex;align-items:center;margin:14px 0 20px;}
.step{display:flex;flex-direction:column;align-items:center;flex:1;position:relative;}
.step .circle{width:26px;height:26px;border-radius:50%;background:var(--surface-3);border:2px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--ink-muted);z-index:2;}
.step.done .circle{background:var(--good);border-color:var(--good);color:#fff;}
.step.current .circle{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 0 0 4px rgba(57,135,229,.25);}
.step .stitle{font-size:10px;color:var(--ink-muted);margin-top:6px;text-align:center;max-width:80px;}
.step.done .stitle,.step.current .stitle{color:var(--ink);}
.step:not(:last-child)::after{content:'';position:absolute;top:13px;left:calc(50% + 16px);right:calc(-50% + 16px);
  height:2px;background:var(--border-strong);z-index:1;}
.step.done:not(:last-child)::after{background:var(--good);}

/* ---------- chart helpers ---------- */
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11.5px;color:var(--ink-2);}
.chart-legend .item{display:flex;align-items:center;gap:6px;}
.chart-legend .sw{width:9px;height:9px;border-radius:2px;}
.tooltip-svg{position:fixed;background:#1a2130;color:#fff;border:1px solid var(--border-strong);border-radius:8px;padding:7px 10px;
  font-size:11.5px;pointer-events:none;z-index:200;box-shadow:var(--shadow);display:none;white-space:nowrap;}

.view-toggle{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;}
.view-toggle button{background:none;border:none;color:var(--ink-muted);padding:6px 12px;border-radius:7px;font-size:12px;
  font-weight:700;cursor:pointer;}
.view-toggle button.active{background:var(--surface-3);color:var(--ink);}

.activity-item{display:flex;gap:11px;padding:10px 0;border-bottom:1px dashed var(--border);}
.activity-item:last-child{border-bottom:none;}
.activity-item .aic{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.activity-item .aic svg{width:14px;height:14px;}
.activity-item .txt{font-size:12.5px;}
.activity-item .time{font-size:10.5px;color:var(--ink-muted);margin-top:2px;}

@media(max-width:820px){
  .sidebar{position:fixed;left:-260px;z-index:80;transition:left .2s;} .sidebar.mobile-open{left:0;}
  .main{width:100%;}
}

/* ---------- COMBO SEARCH (dropdown pencarian: customer/vin, labor, part) ---------- */
.combo{position:relative;}
.combo-list{position:absolute;left:0;right:0;top:calc(100% - 8px);background:var(--surface-2);
  border:1px solid var(--border-strong);border-radius:10px;max-height:240px;overflow-y:auto;
  box-shadow:var(--shadow);z-index:40;display:none;}
.combo-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);}
.combo-item:last-child{border-bottom:none;}
.combo-item:hover{background:var(--surface-3);}
.combo-item .ci-label{font-size:13px;font-weight:600;}
.combo-item .ci-sub{font-size:11px;color:var(--ink-muted);margin-top:2px;}
.combo-empty{padding:12px;font-size:12.5px;color:var(--ink-muted);text-align:center;}

/* ---------- role switcher & permission UI ---------- */
.role-pill{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:10px;padding:6px 10px;font-size:12px;cursor:pointer;white-space:nowrap;}
.role-pill b{color:var(--ink);}
.role-pill:hover{border-color:var(--border-strong);}

/* ---------- login screen (halaman depan sesuai role) ---------- */
.login-screen{position:fixed;inset:0;z-index:65;display:flex;align-items:center;justify-content:center;
  background:var(--page);}
.login-card{width:380px;max-width:92vw;background:var(--surface);border:1px solid var(--border-strong);
  border-radius:18px;padding:32px 28px;text-align:center;box-shadow:0 20px 60px rgba(20,30,55,.15);}
.login-card .login-logo{width:56px;height:56px;border-radius:14px;background:var(--brand);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:800;margin:0 auto 14px;overflow:hidden;}
.login-card .login-logo img{width:100%;height:100%;object-fit:contain;}
.login-card h1{margin:0 0 2px;font-size:19px;}
.login-card .sub{margin:0 0 18px;}
.login-card label{text-align:left;}
.login-card select{width:100%;}

/* ---------- privilege menu checklist (Karyawan/Role, khusus Super Admin) ---------- */
.priv-chk{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);
  padding:6px 10px;border-radius:20px;font-size:12.5px;margin:0 6px 6px 0;}
.priv-chk input[type=checkbox]{width:auto;margin:0;}
.warn-box{background:rgba(201,138,0,.12);border:1px solid rgba(201,138,0,.35);color:#8a5f00;
  padding:10px 12px;border-radius:10px;font-size:12.5px;margin-bottom:12px;}
.danger-box{background:rgba(194,58,58,.12);border:1px solid rgba(194,58,58,.35);color:#a13030;
  padding:10px 12px;border-radius:10px;font-size:12.5px;margin-bottom:12px;}
.pick-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--border);font-size:13px;}
.pick-row input[type=checkbox]{width:auto;margin:0;}
.pick-row .prname{flex:1;}
.pick-row .prqty{color:var(--ink-muted);font-size:12px;}
.link-id{color:var(--brand);cursor:pointer;font-weight:700;}
.link-id:hover{text-decoration:underline;}

/* ---------- cetak / print (WO & Invoice) ---------- */
.print-page{background:#fff;color:#111;max-width:800px;margin:0 auto;padding:36px 40px;font-family:Arial,Helvetica,sans-serif;}
.print-head{display:flex;align-items:center;gap:16px;border-bottom:3px solid #111;padding-bottom:14px;margin-bottom:18px;}
.print-head .logo-box{width:64px;height:64px;border-radius:8px;background:transparent;color:#111;display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:12px;text-align:center;flex-shrink:0;overflow:hidden;}
.print-head .logo-box img{width:100%;height:100%;object-fit:contain;}
.print-head h1{margin:0;font-size:19px;}
.print-head p{margin:2px 0 0;font-size:12px;color:#444;}
.print-title{text-align:right;margin-left:auto;}
.print-title h2{margin:0;font-size:16px;letter-spacing:.04em;}
.print-title p{margin:2px 0 0;font-size:12px;color:#444;}
.print-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 18px;font-size:12.5px;margin-bottom:16px;}
.print-grid div span{color:#666;display:inline-block;min-width:110px;}
.print-page table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px;}
.print-page th,.print-page td{border:1px solid #ccc;padding:6px 8px;text-align:left;}
.print-page th{background:#f0f0f0;}
.print-page td.num,.print-page th.num{text-align:right;}
.print-total{text-align:right;font-size:14px;font-weight:800;margin:10px 0 20px;}
.print-sign{display:flex;justify-content:space-between;margin-top:50px;font-size:12px;}
.print-sign .box{width:220px;text-align:center;}
.print-sign .line{border-bottom:1px solid #111;height:60px;margin-bottom:6px;}
.print-actions{max-width:800px;margin:0 auto 16px;display:flex;gap:10px;justify-content:flex-end;}
@media print{ .print-actions{display:none;} body{background:#fff;} }
</style>
</head>

// Daftar flat semua menu (dipakai matrix Privilege Menu di Karyawan/Role) - id & label ikut definisi NAV di atas.
const MENU_LIST = (function(){ const out=[]; NAV.forEach(g=>{ g.items.forEach(it=>{ out.push({id:it.id, label:it.label, group:g.group||'Umum'}); }); }); return out; })();
// window.__menuPerms diisi dari getMenuPermissions() saat login/init. 'Super Admin' selalu penuh akses,
// dan menu tanpa baris privilege eksplisit dianggap TERLIHAT (allow-by-default).
// Baris dengan Username terisi = override KHUSUS 1 orang (dicek lebih dulu), baris tanpa Username
// (kosong) = default untuk SEMUA orang dengan Role tsb. Ini dipakai ketika ada >1 orang di Role yang
// sama tapi butuh akses menu berbeda, misal 2 orang sama-sama SA.
function isMenuAllowed(role, menuId, username){
  if(role==='Super Admin') return true;
  const rows = window.__menuPerms||[];
  if(username){
    const userRow = rows.find(r=>r.Role===role && r.MenuID===menuId && String(r.Username||'').trim()===String(username).trim());
    if(userRow) return !(userRow.Allowed===false || userRow.Allowed==='FALSE' || userRow.Allowed==='false');
  }
  const row = rows.find(r=>r.Role===role && r.MenuID===menuId && !String(r.Username||'').trim());
  if(!row) return true;
  return !(row.Allowed===false || row.Allowed==='FALSE' || row.Allowed==='false');
}
function buildNav(){
  const el = document.getElementById('navGroup');
  const actor = getActor();
  el.innerHTML = NAV.map((g,gi) => {
    const visibleItems = g.items.filter(it=>isMenuAllowed(actor.role, it.id, actor.username));
    if(visibleItems.length===0) return '';
    return `
    ${g.group ? `<div class="nav-title" data-group-toggle="${gi}"><span>${g.group}</span><svg class="nav-arrow" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M6 9l6 6 6-6"/></svg></div>` : ''}
    <div class="nav-items" data-group="${gi}">
    ${visibleItems.map(it => `<div class="nav-item" data-view="${it.id}" title="${it.label}">${icon(it.icon)}<span class="label">${it.label}</span>${it.id==='partmaster'?'<span class="nav-badge" id="navLowStock" style="display:none"></span>':''}</div>`).join('')}
    </div>
  `;}).join('');
  el.querySelectorAll('.nav-item').forEach(item=>{
    item.addEventListener('click', ()=>{
      el.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
      item.classList.add('active');
      const view = item.getAttribute('data-view');
      const label = item.querySelector('.label').textContent;
      document.getElementById('pageTitle').textContent = label;
      document.getElementById('crumb').textContent = 'DMS / ' + label;
      document.getElementById('sidebar').classList.remove('mobile-open');
      views[view]();
    });
  });
  el.querySelectorAll('[data-group-toggle]').forEach(hdr=>{
    hdr.addEventListener('click', ()=>{
      const gi = hdr.getAttribute('data-group-toggle');
      hdr.classList.toggle('collapsed');
      const itemsEl = el.querySelector('.nav-items[data-group="'+gi+'"]');
      if(itemsEl) itemsEl.classList.toggle('collapsed');
    });
  });
  // Dashboard bisa saja disembunyikan dari role tertentu - kalau begitu, aktifkan menu pertama yang terlihat.
  const dashItem = el.querySelector('[data-view="dashboard"]');
  const firstItem = el.querySelector('.nav-item');
  if(dashItem) dashItem.classList.add('active');
  else if(firstItem) firstItem.classList.add('active');
}

function initBrandLogo(){

    const el = document.getElementById(id);
    if(!el) return;
    if(COMPANY.logoUrl){
      el.classList.add('has-img');
      el.innerHTML = '';

function fmtMoney(n){ n = Number(n)||0; if(Math.abs(n)>=1000000) return 'Rp '+(n/1000000).toFixed(1).replace('.0','')+'jt'; return 'Rp ' + n.toLocaleString('id-ID'); }
function fmtMoneyFull(n){ return 'Rp ' + (Number(n)||0).toLocaleString('id-ID'); }
function fmtDate(d){ if(!d) return '-'; const dt = new Date(d); return isNaN(dt) ? d : dt.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }
function timeAgo(d){ if(!d) return ''; const s = (Date.now()-new Date(d).getTime())/1000; if(s<60) return 'baru saja'; if(s<3600) return Math.floor(s/60)+' menit lalu'; if(s<86400) return Math.floor(s/3600)+' jam lalu'; return Math.floor(s/86400)+' hari lalu'; }
function val(id){ const e = document.getElementById(id); return e ? e.value : ''; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// Parsing angka yang toleran: field harga di Google Sheet kadang pernah diedit manual sebagai TEKS
// (mis. "Rp 150.000"), yang bikin Number() bawaan salah baca (Number("150.000")=150, Number("Rp 150.000")=NaN).
// Uang di sistem ini selalu Rupiah bulat tanpa desimal, jadi aman buang semua karakter non-digit lalu parse.
function parseMoneyLoose(v){
  if(typeof v==='number') return v;
  if(v==null || v==='') return 0;
  const digits = String(v).replace(/[^0-9]/g,'');
  return digits ? Number(digits) : 0;
}

// extra: [{key, label, options:[...]}] -> dropdown filter tambahan (exact match).
function filterBarHtml(tableId, extra, dateField, handlers){

  const resetFn = handlers.reset || `resetFilterBar('${tableId}')`;

        <div><label style="font-size:11px;display:block;">Dari Tanggal</label><input type="date" id="flt_${tableId}_from" style="width:150px;"></div>
        <div><label style="font-size:11px;display:block;">Ke Tanggal</label><input type="date" id="flt_${tableId}_to" style="width:150px;"></div>
        ${extra.map(f=>`<div><label style="font-size:11px;display:block;">${esc(f.label)}</label>
          <select id="flt_${tableId}_${f.key}" style="min-width:130px;"><option value="">Semua</option>${f.options.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select></div>`).join('')}
        <button class="btn outline sm" onclick="${applyFn}">Terapkan Filter</button>
        <button class="btn ghost sm" onclick="${resetFn}">Reset</button>
      </div>
    </div>
  `;
}
function applyFilterBar(tableId, onFiltered){
  const raw = window['__rawdata_'+tableId] || [];
  const dateField = window['__fltdatefield_'+tableId] || 'CreatedAt';
  const from = val('flt_'+tableId+'_from');
  const to = val('flt_'+tableId+'_to');
  let filtered = raw;
  if(from) filtered = filtered.filter(r=>r[dateField] && new Date(r[dateField]) >= new Date(from));
  if(to) filtered = filtered.filter(r=>r[dateField] && new Date(r[dateField]) <= new Date(to+'T23:59:59'));
  (window['__fltextra_'+tableId]||[]).forEach(k=>{
    const v = val('flt_'+tableId+'_'+k);
    if(v) filtered = filtered.filter(r=>String(r[k]||'')===v);
  });
  if(onFiltered) onFiltered(filtered);
  else if(window['__tbl_'+tableId]) window['__tbl_'+tableId].refresh(filtered);
  return filtered;
}
function resetFilterBar(tableId, onFiltered){
  setFieldValue('flt_'+tableId+'_from','');
  setFieldValue('flt_'+tableId+'_to','');
  (window['__fltextra_'+tableId]||[]).forEach(k=>setFieldValue('flt_'+tableId+'_'+k,''));
  const raw = window['__rawdata_'+tableId] || [];
  if(onFiltered) onFiltered(raw);
  else if(window['__tbl_'+tableId]) window['__tbl_'+tableId].refresh(raw);
}
function dataTable(opts){
  // opts: {id, columns:[{key,label,render,sortable,numeric}], rows, searchKeys, rowActions}
  window['__rawdata_'+opts.id] = opts.rows;
  const state = { sortKey:null, sortDir:1, q:'' };
  const wrapId = 'tbl_'+opts.id;
  function matches(row){
    if(!state.q) return true;
    const q = state.q.toLowerCase();
    return (opts.searchKeys||opts.columns.map(c=>c.key)).some(k=>String(row[k]||'').toLowerCase().includes(q));
  }
  function sortRows(rows){
    if(!state.sortKey) return rows;
    const k = state.sortKey;
    return [...rows].sort((a,b)=>{
      let va=a[k], vb=b[k];
      if(!isNaN(va) && !isNaN(vb) && va!=='' && vb!==''){ va=Number(va); vb=Number(vb); }
      if(va<vb) return -1*state.sortDir; if(va>vb) return 1*state.sortDir; return 0;
    });
  }
  function render(){
    const filtered = sortRows(opts.rows.filter(matches));
    const el = document.getElementById(wrapId);
    if(!el) return;
    el.innerHTML = `
      <div class="flex-between" style="margin-bottom:12px;">
        <div class="searchbox" style="width:230px;margin-left:0;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input placeholder="Cari..." value="${esc(state.q)}" oninput="window.__tbl_${opts.id}.search(this.value)">
        </div>
        <span class="muted" style="font-size:12px;">${filtered.length} data</span>
      </div>
      <div style="overflow-x:auto;">
      <table><thead><tr>
        ${opts.columns.map(c=>`<th ${c.sortable!==false?`onclick="window.__tbl_${opts.id}.sort('${c.key}')"`:''}>${c.label}${state.sortKey===c.key?`<span class="sort-arrow">${state.sortDir>0?'▲':'▼'}</span>`:''}</th>`).join('')}
        ${opts.rowActions?'<th></th>':''}
      </tr></thead><tbody>
      ${filtered.length===0 ? `<tr><td colspan="${opts.columns.length+1}">${emptyState('Tidak ada data')}</td></tr>` :
        filtered.map(row=>`<tr>${opts.columns.map(c=>`<td class="${c.numeric?'num':''}">${c.render?c.render(row):esc(row[c.key])}</td>`).join('')}${opts.rowActions?`<td>${opts.rowActions(row)}</td>`:''}</tr>`).join('')}
      </tbody></table>
      </div>
    `;
  }
  window['__tbl_'+opts.id] = {
    search(q){ state.q = q; render(); },
    sort(k){ if(state.sortKey===k) state.sortDir*=-1; else {state.sortKey=k; state.sortDir=1;} render(); },
    refresh(rows){ if(rows) opts.rows = rows; render(); }
  };
  return `<div id="${wrapId}"></div>`;
}

// opts: {getLabel(item), getSub(item)?, getValue(item), searchText(item)->string, onSelect(item)?, initial?}
function attachComboSearch(id, items, opts){
  const input = document.getElementById(id+'_input');
  const hidden = document.getElementById(id);
  const list = document.getElementById(id+'_list');
  if(!input || !hidden || !list) return;
  let currentFiltered = [];
  function renderList(filtered){
    currentFiltered = filtered;
    if(!filtered.length){ list.innerHTML = `<div class="combo-empty">Tidak ditemukan</div>`; list.style.display='block'; return; }
    list.innerHTML = filtered.slice(0,30).map((it,i)=>`<div class="combo-item" data-i="${i}"><div class="ci-label">${esc(opts.getLabel(it))}</div>${opts.getSub?`<div class="ci-sub">${esc(opts.getSub(it))}</div>`:''}</div>`).join('');
    list.style.display='block';
    list.querySelectorAll('.combo-item').forEach((el,i)=>{
      el.addEventListener('mousedown', function(e){
        e.preventDefault();
        const it = currentFiltered[i];
        hidden.value = opts.getValue(it);
        input.value = opts.getLabel(it);
        list.style.display='none';
        if(opts.onSelect) opts.onSelect(it);
      });
    });
  }
  input.addEventListener('input', function(){
    const q = input.value.trim().toLowerCase();
    hidden.value = '';
    if(!q){ list.style.display='none'; return; }
    // String(...||'') sengaja dipakai (bukan langsung .toLowerCase()) supaya kalau ada 1 baris data yang
    // field pencariannya kosong/undefined (mis. data lama/tidak lengkap di sheet), pencarian TIDAK error
    // dan berhenti total untuk semua item lain - cukup baris itu saja yang tidak match.
    renderList((items||[]).filter(it=> String(opts.searchText(it)||'').toLowerCase().includes(q)));
  });
  input.addEventListener('focus', function(){ if(input.value.trim()) input.dispatchEvent(new Event('input')); });
  input.addEventListener('blur', function(){ setTimeout(()=>{ list.style.display='none'; }, 150); });
  if(opts.initial){ hidden.value = opts.getValue(opts.initial); input.value = opts.getLabel(opts.initial); }
}

// Horizontal bar chart - identity/kategori, label langsung di ujung bar.
// Semua koordinat/angka diisi lewat DOM API setelah SVG dipasang ke halaman (bukan lewat teks HTML),
// supaya kebal dari gangguan tanda kutip di jaringan/browser tertentu.
function hBarChart(items, opts={}){
  const max = Math.max(1, ...items.map(i=>i.value));
  const barH = 20, gap = 14;
  const chartW = 560, leftPad = 130, rightPad = 60;
  const plotW = chartW - leftPad - rightPad;
  const h = items.length * (barH+gap);
  let inner = '';
  items.forEach(function(it){
    inner += '<text class="hbar-label" text-anchor="end" font-size="11.5" fill="var(--ink-2)"></text>';
    inner += '<rect class="hbar-track" rx="4" fill="var(--surface-3)" opacity=".35"></rect>';
    inner += '<rect class="hbar" fill="var(--s1)" style="cursor:pointer;"></rect>';
    inner += '<text class="hbar-value" font-size="11.5" font-weight="700" fill="var(--ink)"></text>';
  });
  const svg = '<svg class="hbar-svg" preserveAspectRatio="xMinYMin meet" style="overflow:visible;" width="100%">' + inner + '</svg>';
  return { svg: svg, items: items, fmt: opts.fmt, layout: {chartW:chartW, h:h, leftPad:leftPad, barH:barH, gap:gap, plotW:plotW, max:max} };
}
function attachHBarChart(containerEl, chart){
  const svgEl = containerEl.querySelector('.hbar-svg');
  if(!svgEl) return;
  const L = chart.layout;
  svgEl.setAttribute('viewBox', '0 0 ' + L.chartW + ' ' + (L.h+10));
  svgEl.style.maxWidth = L.chartW + 'px';
  const labels = svgEl.querySelectorAll('.hbar-label');
  const tracks = svgEl.querySelectorAll('.hbar-track');
  const bars = svgEl.querySelectorAll('.hbar');
  const values = svgEl.querySelectorAll('.hbar-value');

    const y = i*(L.barH+L.gap);
    const bw = Math.max(2, (it.value/L.max)*L.plotW);
    labels[i].setAttribute('x', L.leftPad-10); labels[i].setAttribute('y', y+L.barH/2+4); labels[i].textContent = it.label;
    tracks[i].setAttribute('x', L.leftPad); tracks[i].setAttribute('y', y); tracks[i].setAttribute('width', L.plotW); tracks[i].setAttribute('height', L.barH);
    bars[i].setAttribute('x', L.leftPad); bars[i].setAttribute('y', y); bars[i].setAttribute('width', bw); bars[i].setAttribute('height', L.barH);
    bars[i].style.fill = 'var(--' + (it.colorVar||'s1') + ')';

  });
}

// Line/area chart - trend waktu (satu seri, hue sequential biru). Sama seperti di atas: koordinat
// diisi lewat DOM API setelah dipasang ke halaman.
function lineChart(labels, values, opts={}){
  const chartW = 560, chartH = 200, padL = 50, padR = 16, padT = 16, padB = 30;
  const plotW = chartW-padL-padR, plotH = chartH-padT-padB;
  const max = Math.max(...values, 1);
  const min = Math.min(...values, 0);
  const range = (max-min)||1;
  const pts = values.map((v,i)=>({
    x: padL + (i/(values.length-1||1))*plotW,
    y: padT + plotH - ((v-min)/range)*plotH,
    v, label: labels[i]
  }));
  let gridLines = '';
  for(let k=0;k<5;k++){ gridLines += '<line class="grid-line" data-k="'+k+'"></line>'; }
  let dots = '', labelTexts = '';
  pts.forEach(function(){ dots += '<circle class="linept" r="4.5" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" style="cursor:pointer;"></circle>'; });
  pts.forEach(function(){ labelTexts += '<text class="line-label" text-anchor="middle" font-size="10" fill="var(--ink-muted)"></text>'; });
  const svg = '<svg class="line-svg" style="overflow:visible;" width="100%">' +
    '<defs><linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="var(--s1)" stop-opacity=".22"></stop>' +
      '<stop offset="100%" stop-color="var(--s1)" stop-opacity="0"></stop>' +
    '</linearGradient></defs>' +
    gridLines +
    '<path class="area-path" fill="url(#areaFill)"></path>' +
    '<path class="line-path" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>' +
    dots + labelTexts +
    '<text class="line-endlabel" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--ink)"></text>' +
  '</svg>';
  return {svg: svg, pts: pts, fmt: opts.fmt, layout:{chartW:chartW, chartH:chartH, padL:padL, padR:padR, padT:padT, plotH:plotH}};
}
function attachLineChart(containerEl, chart){
  const svgEl = containerEl.querySelector('.line-svg');
  if(!svgEl) return;
  const L = chart.layout, pts = chart.pts;
  svgEl.setAttribute('viewBox', '0 0 ' + L.chartW + ' ' + L.chartH);
  svgEl.style.maxWidth = L.chartW + 'px';

  });

  const areaPath = path + ' L' + pts[pts.length-1].x.toFixed(1) + ' ' + (L.padT+L.plotH) + ' L' + pts[0].x.toFixed(1) + ' ' + (L.padT+L.plotH) + ' Z';
  svgEl.querySelector('.area-path').setAttribute('d', areaPath);

// Donut chart - proporsi (mis. status PO). Koordinat & angka DIISI lewat DOM API setelah dipasang ke halaman
// (bukan dituliskan sebagai teks di dalam string HTML), supaya kebal dari gangguan tanda kutip di jaringan/browser.
function donutChart(items, opts={}){
  const size = opts.size||160, r=size/2-14, cx=size/2, cy=size/2, sw=20;
  const total = items.reduce((s,i)=>s+i.value,0)||1;
  let acc = -90;
  const circ = 2*Math.PI*r;
  const parts = [];
  parts.push('<svg class="donut-svg">');
  items.forEach((it,i)=>{
    parts.push('<circle class="donut-seg" data-i="'+i+'" fill="none" stroke="var(--'+it.colorVar+')" style="cursor:pointer;transition:.2s;"/>');
  });
  parts.push('<text class="donut-total-num" text-anchor="middle" font-size="20" font-weight="800" fill="var(--ink)"></text>');
  parts.push('<text class="donut-total-lbl" text-anchor="middle" font-size="10" fill="var(--ink-muted)">Total</text>');
  parts.push('</svg>');
  return { svg: parts.join(''), size, r, cx, cy, sw, circ, total, items };
}
function attachDonutChart(containerEl, chart){
  const svgEl = containerEl.querySelector('.donut-svg');
  if(!svgEl) return;
  svgEl.setAttribute('width', chart.size);
  svgEl.setAttribute('height', chart.size);
  svgEl.setAttribute('viewBox', '0 0 ' + chart.size + ' ' + chart.size);
  let acc = -90;
  const segs = svgEl.querySelectorAll('.donut-seg');
  chart.items.forEach((it,i)=>{
    const el = segs[i];
    const frac = it.value/chart.total;
    const dash = chart.circ*frac;
    el.setAttribute('cx', chart.cx); el.setAttribute('cy', chart.cy); el.setAttribute('r', chart.r);
    el.setAttribute('stroke-width', chart.sw);
    el.setAttribute('stroke-dasharray', (dash-2)+' '+(chart.circ-dash+2));
    el.setAttribute('stroke-dashoffset', (-acc/360*chart.circ));
    el.setAttribute('transform', 'rotate(-90 '+chart.cx+' '+chart.cy+')');
    acc += frac*360;
  });
  const numEl = svgEl.querySelector('.donut-total-num');
  numEl.setAttribute('x', chart.cx); numEl.setAttribute('y', chart.cy-2); numEl.textContent = chart.total;
  const lblEl = svgEl.querySelector('.donut-total-lbl');
  lblEl.setAttribute('x', chart.cx); lblEl.setAttribute('y', chart.cy+16);
}

`[SA] Create New Order (WO)

      v
 Status: NEW  --------------------------------------------------+

      |   Manager dulu (approve diskon) sebelum bisa Dispatching  |  bisa BATALKAN WO dari
      v                                                           |  status manapun (kondisi
 Status: DISPATCHING (mekanik mulai kerjakan unit)                |  abnormal). Tombol ini

 Status: VEHICLE DELIVERY (WO selesai)  <------------------------+`

/* ================= DASHBOARD ================= */
async function renderDashboard(period){
  period = period || 'this_month';
  setMain(`<div class="cards">${Array.from({length:5}).map(()=>'<div class="skeleton" style="height:90px"></div>').join('')}</div><div class="skeleton" style="height:260px"></div>`);
  const res = await apiGet('getDashboard', {period});
  if(!res.success){ setMain(`<div class="panel">${emptyState('Gagal memuat dashboard: '+esc(res.message))}</div>`); return; }
  const d = res.data;
  const trend = d.periodTrend || {};

  document.getElementById('bellDot').style.display = d.lowStockCount>0 ? 'block':'none';
  const navBadge = document.getElementById('navLowStock');
  if(navBadge){ navBadge.style.display = d.lowStockCount>0?'inline-block':'none'; navBadge.textContent = d.lowStockCount; }

  const woItems = Object.entries(d.woByStatus).map(([label,value])=>({label,value,colorVar:WO_STATUS_SLOT[label]}));
  const poEntries = Object.entries(d.poStatusBreakdown||{});
  const poColors = ['s1','s4','s6','s3','critical'];
  const poItems = poEntries.map(([label,value],i)=>({label,value,colorVar: PO_STATUS_BADGE[label]==='good'?'s6':PO_STATUS_BADGE[label]==='critical'?'s5': (poColors[i]||'s7')}));

  setMain(`
    <div class="page-head"><div><h2>Dashboard</h2><p>Ringkasan performa periode: <b>${esc(periodLabel(period))}</b></p></div>
      <div><label style="font-size:11px;display:block;">Periode Scorecard</label>${periodSelectorHtml('dash_period', period, 'renderDashboard(this.value)')}</div>
    </div>
    <div class="cards">
      <div class="stat-card"><div class="icon" style="background:rgba(57,135,229,.16);color:var(--s1)">${icon('wo')}</div>
        <div class="label">WO Baru (${esc(periodLabel(period))})</div><div class="value">${d.woBaruPeriode}${trendBadgeHtml(trend.woBaru)}</div></div>
      <div class="stat-card"><div class="icon" style="background:rgba(201,133,0,.16);color:var(--s4)">${icon('po')}</div>
        <div class="label">PO Menunggu Approval</div><div class="value">${d.poPendingApproval}</div></div>
      <div class="stat-card"><div class="icon" style="background:rgba(208,59,59,.16);color:var(--critical)">${icon('warning')}</div>
        <div class="label">Part Stok Rendah</div><div class="value">${d.lowStockCount}</div>
        ${d.lowStockCount>0?`<div class="delta down">Perlu tindakan</div>`:`<div class="delta up">Semua aman</div>`}</div>
      <div class="stat-card"><div class="icon" style="background:rgba(12,163,12,.16);color:var(--good)">${icon('money')}</div>
        <div class="label">Revenue (${esc(periodLabel(period))})</div><div class="value" style="font-size:19px;">${fmtMoney(d.revenueThisMonth)}${trendBadgeHtml(trend.revenue)}</div></div>
      <div class="stat-card"><div class="icon" style="background:rgba(57,135,229,.10);color:var(--s1)">${icon('wo')}</div>
        <div class="label">Total Work Order (Sepanjang Waktu)</div><div class="value">${d.totalWO}</div></div>
    </div>
    <div class="grid2">
      <div class="panel">
        <h3>Tren Revenue 6 Bulan Terakhir</h3>
        <p class="sub">Dari Work Order berstatus Invoice / Vehicle Delivery</p>
        <div id="lineChartWrap"></div>
      </div>
      <div class="panel">
        <h3>Work Order per Status</h3>
        <p class="sub">Distribusi WIP saat ini</p>
        <div id="barChartWrap"></div>
      </div>
    </div>
    <div class="grid2">
      <div class="panel">
        <h3>Status Purchase Order</h3>
        <p class="sub">Proporsi PO berdasarkan status</p>
        <div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;" id="donutWrap">
          ${poEntries.length ? '' : emptyState('Belum ada data PO')}
        </div>
      </div>
      <div class="panel">
        <h3>Aktivitas Terbaru</h3>
        <p class="sub">Work order & mutasi stok terkini</p>
        ${(d.recentActivity||[]).length===0 ? emptyState('Belum ada aktivitas') : d.recentActivity.map(a=>`
          <div class="activity-item">
            <div class="aic" style="background:${a.type==='Inbound'?'rgba(12,163,12,.16)':a.type==='Outbound'?'rgba(208,59,59,.16)':'rgba(57,135,229,.16)'};color:${a.type==='Inbound'?'var(--good)':a.type==='Outbound'?'var(--critical)':'var(--s1)'}">
              ${icon(a.type==='Inbound'?'inbound':a.type==='Outbound'?'outbound':'wo')}
            </div>
            <div><div class="txt">${esc(a.text)}</div><div class="time">${timeAgo(a.tgl)}</div></div>
          </div>`).join('')}
      </div>
    </div>
    ${d.lowStockList && d.lowStockList.length ? `
    <div class="panel">
      <h3>⚠ Part Stok Rendah (≤ Stok Minimum)</h3>
      <table><tr><th>Part</th><th>Nama</th><th>Stok</th><th>Min</th></tr>
        ${d.lowStockList.map(p=>`<tr><td>${esc(p.PartNumber)}</td><td>${esc(p.PartName)}</td><td class="num">${p.StokAkhir}</td><td class="num">${p.StokMinimum}</td></tr>`).join('')}
      </table>
    </div>` : ''}
  `);

  const lc = lineChart(d.revenueTrend.labels, d.revenueTrend.values, {fmt:fmtMoney});
  const lineWrap = document.getElementById('lineChartWrap');
  lineWrap.innerHTML = lc.svg;
  attachLineChart(lineWrap, lc);
  attachLineTooltip(lineWrap, lc.pts, fmtMoney);

  const bc = hBarChart(woItems);
  const barWrap = document.getElementById('barChartWrap');
  barWrap.innerHTML = bc.svg;
  attachHBarChart(barWrap, bc);
  attachBarTooltip(barWrap, woItems);

  if(poEntries.length){
    const donut = donutChart(poItems);
    const donutWrap = document.getElementById('donutWrap');
    donutWrap.innerHTML = donut.svg + legendFor(poItems);
    attachDonutChart(donutWrap, donut);
  }
}

async function renderCustomer(){
  setMain(skeletonRows(4));
  const res = await apiGet('listCustomer');
  const data = res.data || [];
  setMain(`
    <div class="page-head"><div><h2>Customer</h2><p>Master data pelanggan (${data.length} total)</p></div>
      <button class="btn" onclick="formCustomer()">${icon('plus')} Tambah Customer</button></div>

async function saveCustomer(id){
  const payload = { CustomerID:id, Nama:val('f_nama'), NoHP:val('f_hp'), Email:val('f_email'), Alamat:val('f_alamat') };

  if(res.success){ toast('Customer tersimpan'); closeDrawer(); renderCustomer(); } else toast(res.message,true);

async function renderPartMaster(){

  window.__parts = data;
  const lowCount = data.filter(p=>Number(p.StokAkhir)<=Number(p.StokMinimum)).length;
  const actor = getActor();
  const canEdit = actor.role==='Super Admin';

      ${canEdit ? `<button class="btn" onclick="formPart()">${icon('plus')} Tambah Part</button>` : ''}</div>
    ${!canEdit ? `<div class="warn-box" style="margin-bottom:12px;">Part Master hanya bisa diubah oleh akun <b>Super Admin</b>. Anda login sebagai <b>${esc(actor.role)}</b> - tampilan di bawah hanya untuk dilihat (read-only).</div>` : ''}
    <div class="panel">${dataTable({
      id:'part', rows:data, searchKeys:['PartNumber','PartName','Kategori'],
      columns:[
        {key:'PartNumber', label:'Part No'}, {key:'PartName', label:'Nama'}, {key:'Kategori', label:'Kategori', render:p=>esc(p.Kategori||'-')},
        {key:'HargaJual', label:'Harga Jual', numeric:true, render:p=>fmtMoneyFull(p.HargaJual)},
        {key:'StokAkhir', label:'Stok', numeric:true, render:p=>Number(p.StokAkhir)<=Number(p.StokMinimum)?`<span class="badge critical"><span class="dot"></span>${p.StokAkhir}</span>`:p.StokAkhir},
        {key:'StokMinimum', label:'Min', numeric:true}
      ],
      rowActions: canEdit ? (p=>`<button class="btn ghost sm" onclick='formPart(${JSON.stringify(p)})'>${icon('edit')} Edit</button>`) : undefined
    })}</div>
  `);
  initTable('part');
}
function formPart(p){
  const actor = getActor();
  if(actor.role!=='Super Admin'){ toast('Hanya akun Super Admin yang boleh menambah/mengubah Part Master', true); return; }
  p = p || {};

async function loadMenuPrivilegeUI(){

  const groups = {};
  MENU_LIST.forEach(m=>{ (groups[m.group]=groups[m.group]||[]).push(m); });
  const actor = getActor();
  const disabled = actor.role!=='Super Admin' ? 'disabled' : '';
  box.innerHTML = Object.keys(groups).map(g=>`
    <div style="margin-bottom:12px;">
      <div style="font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:6px;">${esc(g)}</div>

          // mulai dari kondisi default role-nya supaya jelas apa yang akan berubah kalau disimpan.
          const allowed = isMenuAllowed(role, m.id, username);
          return `<label class="priv-chk"><input type="checkbox" data-menu="${m.id}" ${allowed?'checked':''} ${disabled}><span>${esc(m.label)}</span></label>`;

async function showLoginScreen(){
  const appRoot = document.getElementById('appRoot');
  if(appRoot) appRoot.style.display='none';
  const ls = document.getElementById('loginScreen');
  if(ls) ls.style.display='flex';
  const res = await apiGet('listUsers');
  const users = (res.data||[]).filter(u=> !(u.Active===false||u.Active==='FALSE'));
  window.__loginUsers = users;
  const sel = document.getElementById('login_user_select');
  const emptyMsg = document.getElementById('loginEmpty');
  const btn = document.getElementById('loginSubmitBtn');
  setFieldValue('login_password','');
  const errEl = document.getElementById('loginError'); if(errEl) errEl.style.display='none';
  if(users.length===0){
    if(sel) sel.style.display='none';
    if(emptyMsg) emptyMsg.style.display='block';
    if(btn) btn.style.display='none';
  } else {
    if(sel){ sel.style.display=''; sel.innerHTML = users.map(u=>`<option value="${esc(u.Username)}">${esc(u.Nama)} — ${esc(u.Role)}</option>`).join(''); }
    if(emptyMsg) emptyMsg.style.display='none';
    if(btn) btn.style.display='';
  }
}
async function submitLogin(){
  const uname = val('login_user_select');
  const pwd = val('login_password');
  const errEl = document.getElementById('loginError');
  if(errEl) errEl.style.display='none';
  if(!uname){ toast('Pilih nama Anda terlebih dahulu', true); return; }
  if(!pwd){ if(errEl){errEl.textContent='Password wajib diisi.'; errEl.style.display='block';} return; }
  const res = await apiPost('login', {Username:uname, Password:pwd});
  if(!res.success){
    if(errEl){ errEl.textContent = res.message; errEl.style.display='block'; } else toast(res.message,true);
    return;
  }
  setFieldValue('login_password','');
  if(res.mustSetPassword){
    // JANGAN tandai logged-in dulu sebelum password baru benar-benar dibuat - kalau halaman di-refresh
    // di tengah proses ini, pengguna harus login ulang, bukan lolos ke dashboard tanpa password.
    openMustSetPasswordModal(res.data.Username, res.data.Nama, res.data.Role);
    return;
  }
  try{ localStorage.setItem('dms_logged_in','1'); }catch(e){}
  setActor({name:res.data.Nama, role:res.data.Role, username:res.data.Username});
  await showAppShell();
}
// Akun lama/baru yang belum pernah punya password WAJIB set password sendiri dulu, sebelum bisa lanjut
// masuk ke dashboard - modal ini tidak bisa ditutup tanpa mengisi password baru.
function openMustSetPasswordModal(username, nama, role){
  window.__pendingLogin = {username:username, nama:nama, role:role};
  openModal(`
    <h3 style="margin:0 0 4px;">Buat Password Baru</h3>
    <p class="sub" style="margin:0 0 14px;">Akun Anda belum punya password. Buat password baru sekarang sebelum melanjutkan (minimal 4 karakter).</p>
    <label>Password Baru</label><input type="password" id="newpw_1">
    <label>Ulangi Password Baru</label><input type="password" id="newpw_2">
    <div id="newpw_err" class="danger-box" style="display:none;margin-top:4px;"></div>
    <div style="display:flex;justify-content:flex-end;margin-top:14px;">
      <button class="btn" onclick="confirmSetOwnPassword()">Simpan &amp; Lanjutkan</button>
    </div>
  `);
  window.__modalLocked = true; // modal ini wajib diisi - tidak boleh ditutup lewat klik backdrop
}
async function confirmSetOwnPassword(){
  const pending = window.__pendingLogin;
  if(!pending){ closeModal(); return; }
  const p1 = val('newpw_1'), p2 = val('newpw_2');
  const errEl = document.getElementById('newpw_err');
  if(p1.length<4){ errEl.textContent='Password minimal 4 karakter.'; errEl.style.display='block'; return; }
  if(p1!==p2){ errEl.textContent='Konfirmasi password tidak sama.'; errEl.style.display='block'; return; }
  const res = await apiPost('setOwnPassword', {Username:pending.username, NewPassword:p1});
  if(!res.success){ errEl.textContent=res.message; errEl.style.display='block'; return; }
  window.__modalLocked = false;
  window.__pendingLogin = null;
  try{ localStorage.setItem('dms_logged_in','1'); }catch(e){}
  setActor({name:pending.nama, role:pending.role, username:pending.username});

let woCart = { parts:[], labors:[], sublets:[] };
let woViewMode = 'kanban';
const WO_FLOW = ['New','Dispatching','Material Picking','Completed','Invoice','Vehicle Delivery'];

async function renderWorkOrder(){
  setMain(skeletonRows(4));

  window.__woData = (res.data||[]).sort((a,b)=> new Date(b.CreatedAt)-new Date(a.CreatedAt));

function drawWorkOrderView(){
  const data = window.__woData || [];
  setMain(`
    <div class="page-head">
      <div><h2>Work Order</h2><p>General Repair / Body Repair — ${data.length} WO aktif</p></div>
      <div style="display:flex;gap:10px;">
        <div class="view-toggle">
          <button class="${woViewMode==='kanban'?'active':''}" onclick="woViewMode='kanban';drawWorkOrderView()">Board</button>

        </div>

      {key:'JenisWO', label:'Jenis WO', options:[...new Set(data.map(w=>w.JenisWO).filter(Boolean))]},
      {key:'Mekanik', label:'Mekanik', options:[...new Set(data.map(w=>w.Mekanik).filter(Boolean))]},

  `);
  window['__rawdata_wo'] = data;
  if(woViewMode==='kanban') drawKanban(data); else drawWOList(data);
}
function applyWOFilter(){
  applyFilterBar('wo', filtered=>{ if(woViewMode==='kanban') drawKanban(filtered); else drawWOList(filtered); });
}
function resetWOFilter(){
  resetFilterBar('wo', filtered=>{ if(woViewMode==='kanban') drawKanban(filtered); else drawWOList(filtered); });
}
function drawKanban(data){
  const el = document.getElementById('woBody');
  el.innerHTML = `<div class="kanban">${WO_FLOW.map(status=>{
    const items = data.filter(w=>w.Status===status);
    return `<div class="kanban-col" data-status="${status}">
      <h4><span class="badge ${WO_STATUS_SLOT[status]}"><span class="dot"></span></span>${status}<span class="count">${items.length}</span></h4>
      <div class="kcards" data-status="${status}">
        ${items.map(w=>`
          <div class="kcard" draggable="true" data-woid="${w.WOID}" onclick="viewWorkOrder('${w.WOID}')">
            <div class="woid">${w.WOID}</div>
            <div class="cust">${esc(w.NamaCustomer)}</div>
            <div class="plate">${esc(w.NoPolisi)} · ${esc(w.JenisWO)}</div>
            <div class="foot"><span class="total">${fmtMoney(w.TotalWO)}</span></div>
          </div>`).join('')}
      </div>
    </div>`;
  }).join('')}</div>`;

  // drag & drop
  el.querySelectorAll('.kcard').forEach(card=>{
    card.addEventListener('dragstart', e=>{ card.classList.add('dragging'); e.dataTransfer.setData('text/plain', card.dataset.woid); });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
  });
  el.querySelectorAll('.kanban-col').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('dragover'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('dragover'));
    col.addEventListener('drop', e=>{
      e.preventDefault(); col.classList.remove('dragover');
      const woid = e.dataTransfer.getData('text/plain');
      const newStatus = col.dataset.status;
      const wo = (window.__woData||[]).find(w=>String(w.WOID)===String(woid));
      if(!wo || wo.Status===newStatus) return;
      if(wo.Status==='Cancelled'){ toast('WO ini sudah dibatalkan', true); return; }
      const curIdx = WO_FLOW.indexOf(wo.Status), newIdx = WO_FLOW.indexOf(newStatus);
      if(newIdx < curIdx){ toast('Tidak bisa mundur status WO', true); return; }
      const isSkipMaterialPicking = (wo.Status==='Dispatching' && newStatus==='Completed');
      if(newIdx > curIdx+1 && !isSkipMaterialPicking){ toast('Tidak bisa lompat status, selesaikan tahap sebelumnya dulu', true); return; }
      openAdvanceModal(woid, wo.Status, newStatus);
    });
  });
}
function drawWOList(data){
  document.getElementById('woBody').innerHTML = `<div class="panel">${dataTable({
    id:'wolist', rows:data, searchKeys:['WOID','NamaCustomer','NoPolisi'],
    columns:[
      {key:'WOID', label:'WO ID', render:w=>`<span class="link-id" onclick="viewWorkOrder('${w.WOID}')">${esc(w.WOID)}</span>`},
      {key:'TglWO', label:'Tgl', render:w=>fmtDate(w.TglWO)},
      {key:'NamaCustomer', label:'Customer'}, {key:'NoPolisi', label:'No Polisi'}, {key:'JenisWO', label:'Jenis'},
      {key:'Status', label:'Status', render:w=>statusBadge(w.Status)},
      {key:'TotalWO', label:'Total', numeric:true, render:w=>fmtMoneyFull(w.TotalWO)}
    ],
    rowActions:w=>`<button class="btn ghost sm" onclick="viewWorkOrder('${w.WOID}')">Detail</button>`
  })}</div>`;
  initTable('wolist');
}

async function addWOPart(){
  const pn = val('wo_part_combo');
  if(!pn){ toast('Pilih part terlebih dahulu dari hasil pencarian', true); return; }
  const qty = Number(val('wo_part_qty'))||1;
  const disc = Math.min(1, Math.max(0, Number(val('wo_part_disc'))||0));
  // Ambil ulang data part TERBARU langsung dari server sebelum cek stok, supaya tidak memakai data
  // cache lama di browser (mis. drawer WO sudah lama terbuka sementara stok baru saja berubah di menu lain).
  const pres = await apiGet('listPart');
  if(pres.success) window.__parts = pres.data||window.__parts;
  const part = window.__parts.find(p=>String(p.PartNumber)===String(pn));
  if(!part){ toast('Part tidak ditemukan, silakan cari ulang', true); return; }
  const stokTersedia = Number(part.StokAkhir)||0;
  if(stokTersedia<=0){ toast('Stok part "'+part.PartName+'" saat ini kosong (0), tidak bisa ditambahkan', true); return; }
  if(qty > stokTersedia){ toast('Qty ('+qty+') melebihi stok tersedia ('+stokTersedia+') untuk part "'+part.PartName+'"', true); return; }
  woCart.parts.push({PartNumber:part.PartNumber, PartName:part.PartName, Qty:qty, Harga:part.HargaJual, DiskonPersen:disc});
  renderWOLists();
  setFieldValue('wo_part_combo',''); const inp=document.getElementById('wo_part_combo_input'); if(inp) inp.value='';
  setFieldValue('wo_part_disc',0);
}
function removeWOPart(i){ woCart.parts.splice(i,1); renderWOLists(); }
function addWOLabor(){
  const lc = val('wo_labor_combo');
  if(!lc){ toast('Pilih jasa terlebih dahulu dari hasil pencarian', true); return; }
  const qty = Number(val('wo_labor_qty'))||1;
  const disc = Math.min(1, Math.max(0, Number(val('wo_labor_disc'))||0));
  const labor = window.__labors.find(l=>String(l.LaborCode)===String(lc));
  if(!labor) return;
  woCart.labors.push({LaborCode:lc, LaborName:labor.LaborName, Qty:qty, Harga:labor.Harga, DiskonPersen:disc});
  renderWOLists();
  setFieldValue('wo_labor_combo',''); const inp=document.getElementById('wo_labor_combo_input'); if(inp) inp.value='';
  setFieldValue('wo_labor_disc',0);
}
function removeWOLabor(i){ woCart.labors.splice(i,1); renderWOLists(); }
function addWOSublet(){
  const name = val('wo_sublet_combo_input').trim();
  const qty = Number(val('wo_sublet_qty'))||0;
  const hb = Number(val('wo_sublet_hb'))||0;
  const hj = Number(val('wo_sublet_hj'))||0;
  const disc = Math.min(1, Math.max(0, Number(val('wo_sublet_disc'))||0));
  if(!name || qty<=0){ toast('Cari/ketik nama sublet dan isi qty terlebih dahulu', true); return; }
  if(woCart.sublets.some(s=>s.SubletName.trim().toLowerCase()===name.toLowerCase())){
    toast('Sublet "'+name+'" sudah ada di daftar item WO ini. Hapus dulu kalau mau ubah qty/harga.', true); return;
  }

function removeWOSublet(i){ woCart.sublets.splice(i,1); renderWOLists(); }
// Tabel ringkas untuk daftar item WO (Part/Labor/Sublet) yang sudah ditambahkan ke keranjang -
// lebih rapi & mudah dibandingkan dibanding bentuk chip/pill sebelumnya.
function woItemsTableHtml(items, nameKey, priceKey, removeFnName, emptyLabel){
  if(!items.length) return `<span class="muted" style="font-size:12px;">${emptyLabel}</span>`;
  return `<div style="border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px;">
    <table style="margin:0;"><thead><tr><th>Nama</th><th>Qty</th><th>Harga Satuan</th><th>Diskon</th><th>Subtotal</th><th></th></tr></thead><tbody>
    ${items.map((it,i)=>{
      const harga = it[priceKey]||0;
      const disc = it.DiskonPersen||0;
      const gross = harga*it.Qty;
      const net = gross*(1-disc);
      const discText = disc>0 ? (disc*100).toFixed(disc*100%1===0?0:1)+'%' : '-';
      return `<tr>
        <td>${esc(it[nameKey])}</td>
        <td class="num">${it.Qty}</td>
        <td class="num">${fmtMoneyFull(harga)}</td>
        <td class="num">${discText}</td>
        <td class="num"><b>${fmtMoneyFull(net)}</b></td>
        <td><button class="btn ghost sm" onclick="${removeFnName}(${i})" title="Hapus">&times;</button></td>
      </tr>`;
    }).join('')}
    </tbody></table>
  </div>`;
}
function renderWOLists(){
  document.getElementById('wo_part_list').innerHTML = woItemsTableHtml(woCart.parts, 'PartName', 'Harga', 'removeWOPart', 'Belum ada part.');
  document.getElementById('wo_labor_list').innerHTML = woItemsTableHtml(woCart.labors, 'LaborName', 'Harga', 'removeWOLabor', 'Belum ada jasa.');
  const subletListEl = document.getElementById('wo_sublet_list');
  if(subletListEl) subletListEl.innerHTML = woItemsTableHtml(woCart.sublets, 'SubletName', 'HargaJual', 'removeWOSublet', 'Belum ada sublet.');

  const grossOf = arr => arr.reduce((s,x)=>s+(x.Harga!==undefined?x.Harga:x.HargaJual)*x.Qty,0);
  const discOf = arr => arr.reduce((s,x)=>s+((x.Harga!==undefined?x.Harga:x.HargaJual)*x.Qty)*(x.DiskonPersen||0),0);
  const subtotal = grossOf(woCart.parts) + grossOf(woCart.labors) + grossOf(woCart.sublets);
  const totalDiskon = discOf(woCart.parts) + discOf(woCart.labors) + discOf(woCart.sublets);
  const total = Math.max(0, subtotal - totalDiskon);
  const ratio = subtotal>0 ? (totalDiskon/subtotal) : 0;

  const subtotalEl = document.getElementById('wo_subtotal_preview'); if(subtotalEl) subtotalEl.textContent = fmtMoneyFull(subtotal);
  const diskonPreviewEl = document.getElementById('wo_diskon_preview'); if(diskonPreviewEl) diskonPreviewEl.textContent = fmtMoneyFull(totalDiskon);
  const totalEl = document.getElementById('wo_total_preview'); if(totalEl) totalEl.textContent = fmtMoneyFull(total);
  // PPN 11% di sini murni PREVIEW untuk memperjelas estimasi nilai yang harus dibayar customer saat
  // pembuatan WO - basisnya total setelah diskon. Belum final; penetapan PPN yang resmi tetap dilakukan
  // Kasir saat cetak Invoice (bisa dicentang lagi di sana), jadi tidak mempengaruhi TotalWO yang tersimpan.
  const ppnToggleEl = document.getElementById('wo_ppn_toggle');
  const ppnOn = !!(ppnToggleEl && ppnToggleEl.checked);
  const ppnAmount = ppnOn ? Math.round(total*0.11) : 0;
  const grandTotal = total + ppnAmount;
  const ppnRowEl = document.getElementById('wo_ppn_row'); if(ppnRowEl) ppnRowEl.style.display = ppnOn?'flex':'none';
  const ppnPreviewEl = document.getElementById('wo_ppn_preview'); if(ppnPreviewEl) ppnPreviewEl.textContent = fmtMoneyFull(ppnAmount);
  const gtRowEl = document.getElementById('wo_grandtotal_row'); if(gtRowEl) gtRowEl.style.display = ppnOn?'flex':'none';
  const gtEl = document.getElementById('wo_grandtotal_preview'); if(gtEl) gtEl.textContent = fmtMoneyFull(grandTotal);
  const ratioTextEl = document.getElementById('wo_diskon_ratio_text'); if(ratioTextEl) ratioTextEl.textContent = (ratio*100).toFixed(1)+'%';
  const ratioBarEl = document.getElementById('wo_diskon_ratio_bar');
  if(ratioBarEl){
    ratioBarEl.classList.toggle('over', ratio>0.1);
    const barInner = ratioBarEl.querySelector('div'); if(barInner) barInner.style.width = Math.min(100, ratio*100)+'%';
  }
  const actor = getActor();
  const overLimit = ratio > 0.1;
  const warnEl = document.getElementById('wo_diskon_warning');
  if(warnEl) warnEl.innerHTML = overLimit
    ? `<div class="warn-box" style="margin-top:8px;">Diskon melebihi 10% dari subtotal. WO tetap bisa disimpan, tapi <b>tidak bisa Dispatching</b> sampai disetujui oleh akun Manager.</div>`
    : '';
  // Tombol Simpan TIDAK pernah dinonaktifkan di sini - SA selalu boleh menyimpan WO.
  // Persetujuan Manager baru diperlukan nanti saat WO mau naik ke status Dispatching.
}
async function submitWorkOrder(){
  const custId = val('wo_cust_id'); const vehId = val('wo_veh_combo');
  if(!custId || !vehId){ toast('Pilih Customer / Kendaraan terlebih dahulu lewat kotak pencarian', true); return; }
  const grossOf = arr => arr.reduce((s,x)=>s+(x.Harga!==undefined?x.Harga:x.HargaJual)*x.Qty,0);
  const discOf = arr => arr.reduce((s,x)=>s+((x.Harga!==undefined?x.Harga:x.HargaJual)*x.Qty)*(x.DiskonPersen||0),0);
  const subtotal = grossOf(woCart.parts) + grossOf(woCart.labors) + grossOf(woCart.sublets);
  const totalDiskon = discOf(woCart.parts) + discOf(woCart.labors) + discOf(woCart.sublets);
  const actor = getActor();
  const payload = {
    CustomerID: custId, VehicleID: vehId, JenisWO: val('wo_jenis'),
    SA: val('wo_sa'), KM: val('wo_km'), Keluhan: val('wo_keluhan'), Diskon: totalDiskon,
    ActorRole: actor.role, ActorName: actor.name,
    parts: woCart.parts.map(p=>({PartNumber:p.PartNumber, Qty:p.Qty})),
    labors: woCart.labors.map(l=>({LaborCode:l.LaborCode, Qty:l.Qty})),
    sublets: woCart.sublets.map(s=>({SubletName:s.SubletName, Qty:s.Qty, HargaBeli:s.HargaBeli, HargaJual:s.HargaJual}))
  };
  const res = await apiPost('createWorkOrder', payload);
  if(res.success){ toast('Work Order dibuat: '+res.id); closeDrawer(); renderWorkOrder(); } else toast(res.message,true);
}

  const {header, parts, labors, sublets} = res.data;
  const curIdx = WO_FLOW.indexOf(header.Status);
  let nextStatus = header.Status==='Cancelled' ? null : WO_FLOW[curIdx+1];
  const noParts = (parts||[]).length===0;
  if(nextStatus==='Material Picking' && noParts) nextStatus = 'Completed'; // WO tanpa part, lewati tahap Part Staff
  // SA masih bisa tambah Jasa/Part/Sublet SELAMA belum Completed - begitu Completed, item dikunci.

  const diskonPending = diskonRatio > 0.1 && !header.DiskonApprovedBy;

        <div class="kv"><span>Jenis WO</span><b>${esc(header.JenisWO)}</b></div>
        <div class="kv"><span>SA</span><b>${esc(header.SA)||'-'}</b></div>
        <div class="kv"><span>Mekanik</span><b>${esc(header.Mekanik)||'-'}</b></div>
        <div class="kv"><span>KM</span><b>${esc(header.KM)||'-'}</b></div>
      </div>

      <div class="flex-between"><h3 style="font-size:13.5px;margin:14px 0 8px;">Part</h3>${editable?`<button class="btn ghost sm" onclick="openAddItemModal('${woid}','part')">${icon('plus')} Tambah Part</button>`:''}</div>
      <table><tr><th>Part</th><th>Qty</th><th>Harga</th><th>Subtotal</th><th>Status</th></tr>
        ${parts.map(p=>`<tr><td>${esc(p.PartName)}</td><td>${p.Qty}</td><td>${fmtMoneyFull(p.HargaSatuan)}</td><td>${fmtMoneyFull(p.Subtotal)}</td><td><span class="badge ${p.StatusPicking==='Picked'?'good':p.StatusPicking==='Returned'?'critical':'muted'}"><span class="dot"></span>${p.StatusPicking}</span></td></tr>`).join('') || `<tr><td colspan="5">${emptyState('Tidak ada part')}</td></tr>`}

      <div class="flex-between"><h3 style="font-size:13.5px;margin:14px 0 8px;">Labor</h3>${editable?`<button class="btn ghost sm" onclick="openAddItemModal('${woid}','labor')">${icon('plus')} Tambah Jasa</button>`:''}</div>

    </div>
    <div class="drawer-foot">
      <div style="display:flex;gap:8px;">
        <button class="btn secondary" onclick="closeDrawer()">Tutup</button>
        <button class="btn ghost" onclick="printWorkOrder('${woid}')">🖨 Cetak Form WO</button>
        ${['Invoice','Vehicle Delivery'].indexOf(header.Status)!==-1 ? `<button class="btn ghost" onclick="printInvoice('${woid}')">🖨 Cetak Invoice</button>`:''}
      </div>
      <div style="display:flex;gap:8px;">
        ${header.Status!=='Cancelled' && (actor.role==='Manager'||actor.role==='Super Admin') ? `<button class="btn critical" onclick="openCancelModal('${woid}','${esc(header.Status)}')">Batalkan WO</button>`:''}
        ${nextStatus ? `<button class="btn good" onclick="openAdvanceModal('${woid}','${header.Status}','${nextStatus}')">${icon('approve')} Set: ${nextStatus}</button>` : (header.Status!=='Cancelled' ? '<span class="muted">Selesai</span>':'')}
      </div>
    </div>
  `);
}
async function confirmApproveDiskon(woid){

        <div><label>Qty</label><input id="ai_sublet_qty" type="number" value="1"></div>

        <div><label>Harga Jual</label><input id="ai_sublet_hj" type="number" value="0"></div>
      </div>`;
  }
  const titleMap = {part:'Tambah Part ke WO', labor:'Tambah Jasa ke WO', sublet:'Tambah Sublet ke WO'};
  openModal(`
    <h3 style="margin:0 0 14px;">${titleMap[type]}</h3>
    ${bodyHtml}
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:6px;">

      getLabel:p=>`${p.PartNumber} - ${p.PartName}`,
